    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .slide { transition: transform 0.3s ease; }
    .fade { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .pop { animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .brand-grad { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%); }
    .brand-grad-soft { background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 100%); }
    .glass { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.85); }
    .nav-item { position: relative; transition: all 0.2s ease; }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 24px; background: linear-gradient(180deg, #6366f1, #8b5cf6); border-radius: 0 4px 4px 0; }
    .stat-icon { transition: transform 0.3s ease; }
    .stat-card:hover .stat-icon { transform: scale(1.1) rotate(-5deg); }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.15); }
    .ring-glow { box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12); }
    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .gradient-text { background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .table-row { transition: background 0.15s; }
    .table-row:hover { background: linear-gradient(90deg, #eef2ff 0%, transparent 100%); }
  </style>

      table(name) {
        const key = 'hod_' + name;
        const defaults = this.seed[name];
        return {
          all() {
            try { const d = localStorage.getItem(key); if (d) return JSON.parse(d); } catch (e) {}
            localStorage.setItem(key, JSON.stringify(defaults));
            return JSON.parse(JSON.stringify(defaults));
          },
          save(items) { localStorage.setItem(key, JSON.stringify(items)); return items; },
          nextId(items) { return items.length ? Math.max(...items.map(i => i.id)) + 1 : 1; },
          add(item) { const items = this.all(); item.id = this.nextId(items); this.save([...items, item]); return item; },
          update(id, patch) {
            const items = this.all(); const i = items.findIndex(x => x.id === id);
            if (i === -1) return null; items[i] = { ...items[i], ...patch }; this.save(items); return items[i];
          },
          remove(id) { this.save(this.all().filter(x => x.id !== id)); },
          reset() { this.save([...defaults]); },
        };
      }
    };

    function avatar(initials, size) {
      const palettes = [
        'from-violet-500 to-purple-600','from-sky-500 to-blue-600',
        'from-emerald-500 to-teal-600','from-amber-500 to-orange-600',
        'from-pink-500 to-rose-600','from-indigo-500 to-violet-600',
        'from-cyan-500 to-blue-600','from-fuchsia-500 to-pink-600'
      ];
      const grad = palettes[(initials || 'A').charCodeAt(0) % palettes.length];
      const sz = size === 'sm' ? 'h-9 w-9 text-xs' : size === 'lg' ? 'h-14 w-14 text-base' : 'h-11 w-11 text-sm';
      return `<div class="${sz} bg-gradient-to-br ${grad} rounded-2xl flex items-center justify-center font-bold text-white shadow-md flex-shrink-0">${initials}</div>`;
    }

    function statusPill(s) {
      const map = {
        active: { c: 'bg-emerald-50 text-emerald-700', dot: 'bg-emerald-500', label: 'Active' },
        on_leave: { c: 'bg-amber-50 text-amber-700', dot: 'bg-amber-500', label: 'On Leave' },
        at_risk: { c: 'bg-red-50 text-red-700', dot: 'bg-red-500', label: 'At Risk' },
        pending: { c: 'bg-amber-50 text-amber-700', dot: 'bg-amber-500', label: 'Pending' },
        approved: { c: 'bg-emerald-50 text-emerald-700', dot: 'bg-emerald-500', label: 'Approved' },
        rejected: { c: 'bg-red-50 text-red-700', dot: 'bg-red-500', label: 'Rejected' },
      };
      const p = map[s] || { c: 'bg-slate-100 text-slate-600', dot: 'bg-slate-400', label: s };
      return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${p.c}"><span class="h-1.5 w-1.5 rounded-full ${p.dot}"></span>${p.label}</span>`;
    }

    function progressBar(val, max, w) {
      w = w || 'w-24';
      const pct = Math.round((val / (max || 1)) * 100);
      const color = pct >= 90 ? 'from-emerald-500 to-green-500' : pct >= 75 ? 'from-sky-500 to-blue-500' : pct >= 60 ? 'from-amber-500 to-orange-500' : 'from-red-500 to-rose-500';
      return `<div class="flex items-center gap-2"><div class="${w} h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r ${color} rounded-full transition-all" style="width:${pct}%"></div></div><span class="text-xs font-semibold text-slate-600 min-w-[2.5rem]">${pct}%</span></div>`;
    }

    function statCard(label, value, change, up, iconPath, gradient) {
      return `<div class="stat-card card-hover bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
        <div class="flex items-start justify-between mb-4">
          <div class="stat-icon h-12 w-12 rounded-2xl bg-gradient-to-br ${gradient} flex items-center justify-center text-white shadow-lg">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="${iconPath}"/></svg>
          </div>
          <span class="text-xs font-bold ${up ? 'text-emerald-600 bg-emerald-50' : 'text-red-600 bg-red-50'} px-2.5 py-1 rounded-lg flex items-center gap-1">
            <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="${up ? 'M5 10l7-7m0 0l7 7m-7-7v18' : 'M19 14l-7 7m0 0l-7-7m7 7V3'}"/></svg>
            ${change}

        <p class="text-2xl font-bold text-slate-900 tracking-tight">${value}</p>
        <p class="mt-1 text-sm text-slate-500 font-medium">${label}</p>
      </div>`;
    }

    function openModal(html) {
      closeModal();
      const div = document.createElement('div');
      div.setAttribute('onclick', 'closeModal()');
      div.className = 'fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4';
      div.innerHTML = `<div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto pop" onclick="event.stopPropagation()">${html}</div>`;
      document.body.appendChild(div);
    }

    function closeModal() { document.querySelectorAll('.fixed.inset-0.z-50').forEach(m => m.remove()); }

    function formInput(label, val, name, type, opts) {
      type = type || 'text'; opts = opts || {};
      const id = 'f_' + name;
      let field = '';
      if (type === 'select') {
        field = `<select class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400 focus:border-violet-400 transition" id="${id}">${(opts || []).map(o => `<option value="${o.value}" ${val == o.value ? 'selected' : ''}>${o.label}</option>`).join('')}</select>`;
      } else if (type === 'number') {
        field = `<input type="number" step="${opts.step || '1'}" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400 transition" id="${id}" value="${val || ''}" ${opts.min !== undefined ? `min="${opts.min}"` : ''} ${opts.max !== undefined ? `max="${opts.max}"` : ''}>`;
      } else if (type === 'textarea') {
        field = `<textarea class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400 transition" id="${id}" rows="${opts.rows || 3}">${val || ''}</textarea>`;
      } else {
        field = `<input type="${type}" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400 transition" id="${id}" value="${val || ''}">`;
      }
      return `<div class="space-y-1.5"><label class="block text-xs font-semibold text-slate-700" for="${id}">${label}</label>${field}</div>`;
    }

    function showForm(title, icon, fields, onSave) {
      openModal(`
        <div class="flex items-center gap-3 mb-5 pb-4 border-b border-slate-100">
          <div class="h-11 w-11 rounded-2xl brand-grad flex items-center justify-center text-white shadow-md">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="${icon}"/></svg>
          </div>
          <h2 class="text-lg font-bold text-slate-800">${title}</h2>
        </div>
        <div class="space-y-4">${fields}</div>
        <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-100">
          <button onclick="closeModal()" class="px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">Cancel</button>
          <button onclick="(${onSave.toString()})()" class="px-5 py-2.5 text-sm font-semibold text-white brand-grad rounded-xl shadow-md hover:shadow-lg transition">Save Changes</button>
        </div>
      `);
    }

    function getForm() {
      const data = {};
      document.querySelectorAll('[id^="f_"]').forEach(el => {
        data[el.id.replace('f_', '')] = el.type === 'number' ? parseFloat(el.value) : el.value;
      });
      return data;
    }

    function toast(msg, type) {
      type = type || 'success';
      const colors = { success: 'bg-emerald-500', error: 'bg-red-500', info: 'bg-sky-500' };
      const t = document.createElement('div');
      t.className = `fixed bottom-6 right-6 z-[100] px-5 py-3 ${colors[type]} text-white text-sm font-medium rounded-xl shadow-2xl pop`;

        events: ['Events Calendar', 'Department events & schedule'],
        announcements: ['Announcements', 'Department-wide notices'],

      };
      const t = titles[page] || ['Dashboard', ''];
      const tEl = document.getElementById('pageTitle'); if (tEl) tEl.textContent = t[0];
      const sEl = document.getElementById('pageSubtitle'); if (sEl) sEl.textContent = t[1];

        dashboard: renderDashboard, faculty: renderFaculty, students: renderStudents,

        events: renderEvents, announcements: renderAnnouncements, settings: renderSettings,

    // ─── ANALYTICS ─────────────────────────────────────────────────────────

      el.innerHTML = `<div class="space-y-6 fade">
        <div>
          <h3 class="text-2xl font-extrabold text-slate-800">Analytics & Insights</h3>
          <p class="text-sm text-slate-500 mt-1">Department-wide performance metrics</p>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          ${statCard('Pass Rate', '94.2%', '+2.1%', true, 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z', 'from-emerald-500 to-green-600')}
          ${statCard('Avg CGPA', (students.reduce((s,x)=>s+x.cgpa,0)/students.length).toFixed(2), '+0.12', true, 'M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z', 'from-amber-500 to-orange-600')}
          ${statCard('Faculty:Student', '1:' + Math.round(students.length/faculty.length), 'Optimal', true, 'M17 20h5v-2a3 3 0 00-5.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z', 'from-violet-500 to-purple-600')}
          ${statCard('Research Pubs', faculty.reduce((s,f)=>s+f.pubs,0), 'YTD', true, 'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253', 'from-sky-500 to-blue-600')}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-white rounded-3xl border border-slate-100 p-6 shadow-sm">
            <h3 class="text-base font-bold text-slate-800 mb-4">Attendance by Day</h3>
            <div class="flex items-end gap-3 h-64">
              ${attendance.map(d => {
                const h = (d.value / 100) * 100;
                return `<div class="flex-1 flex flex-col items-center gap-2 h-full justify-end">
                  <div class="text-xs font-bold text-slate-700">${d.value}%</div>
                  <div class="w-full rounded-t-xl bg-gradient-to-t from-violet-500 to-purple-400 transition shadow-md" style="height:${h}%"></div>
                  <span class="text-xs font-medium text-slate-500">${d.day}</span>
                </div>`;
              }).join('')}
            </div>
          </div>

          <div class="bg-white rounded-3xl border border-slate-100 p-6 shadow-sm">
            <h3 class="text-base font-bold text-slate-800 mb-4">CGPA Distribution</h3>
            ${(() => {
              const ranges = [
                { label:'3.5 - 4.0 (Excellent)', count: students.filter(s => s.cgpa >= 3.5).length, color: 'bg-emerald-500' },
                { label:'3.0 - 3.49 (Good)', count: students.filter(s => s.cgpa >= 3.0 && s.cgpa < 3.5).length, color: 'bg-sky-500' },
                { label:'2.5 - 2.99 (Average)', count: students.filter(s => s.cgpa >= 2.5 && s.cgpa < 3.0).length, color: 'bg-amber-500' },
                { label:'Below 2.5 (At Risk)', count: students.filter(s => s.cgpa < 2.5).length, color: 'bg-red-500' },
              ];
              return `<div class="space-y-4">${ranges.map(r => {
                const pct = (r.count / students.length) * 100;
                return `<div><div class="flex justify-between text-sm mb-2"><span class="font-semibold text-slate-700">${r.label}</span><span class="font-bold text-slate-800">${r.count} students</span></div>
                <div class="h-3 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${r.color} rounded-full" style="width:${pct}%"></div></div></div>`;
              }).join('')}</div>`;
            })()}

        </div>

          <h3 class="text-base font-bold text-slate-800 mb-4">Course Enrollment</h3>

              return `<div class="flex items-center gap-4">
                <div class="w-32 flex-shrink-0"><p class="text-sm font-bold text-slate-700">${c.code}</p><p class="text-xs text-slate-400 truncate">${c.title}</p></div>
                <div class="flex-1"><div class="h-3 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-violet-500 to-purple-500 rounded-full transition-all" style="width:${pct}%"></div></div></div>
                <span class="text-sm font-bold text-slate-700 min-w-[3rem] text-right">${c.students}</span>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>`;
    }

    // ─── EVENTS ────────────────────────────────────────────────────────────

    function renderEvents(el) {
      const items = db.events.all();
      el.innerHTML = `<div class="space-y-6 fade">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div><h3 class="text-2xl font-extrabold text-slate-800">Events Calendar</h3><p class="text-sm text-slate-500 mt-1">${items.length} upcoming events</p></div>

                </div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;

    function eventForm() {
      const data = { title:'', date:'', time:'', location:'', type:'event' };

        formInput('Event Title', data.title, 'title') +
        `<div class="grid grid-cols-2 gap-3">${formInput('Date (e.g. Apr 5, 2026)', data.date, 'date')}${formInput('Time', data.time, 'time')}</div>` +
        formInput('Location', data.location, 'location') +
        formInput('Type', data.type, 'type', 'select', [{value:'meeting',label:'Meeting'},{value:'exam',label:'Exam'},{value:'event',label:'Event'},{value:'workshop',label:'Workshop'}]),
        () => { const v = getForm(); if (!v.title) { alert('Title required'); return; } db.events.add(v); toast('Event added'); closeModal(); render(); }

    // ─── ANNOUNCEMENTS ─────────────────────────────────────────────────────

    function renderAnnouncements(el) {
      const items = db.announcements.all();
      el.innerHTML = `<div class="space-y-6 fade">
        <div class="flex items-center justify-between flex-wrap gap-4">

          <button onclick="annForm()" class="px-5 py-2.5 brand-grad text-white text-sm font-bold rounded-xl shadow-md hover:shadow-lg transition flex items-center gap-2">

                </div>
                <button onclick="if(confirm('Delete?')){db.announcements.remove(${a.id});toast('Deleted','error');render();}" class="p-2 rounded-xl text-red-400 hover:bg-red-50"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7"/></svg></button>

        </div>
      </div>`;

        `<div class="grid grid-cols-3 gap-3">${formInput('Category', data.category, 'category', 'select', [{value:'academic',label:'Academic'},{value:'research',label:'Research'},{value:'infrastructure',label:'Infrastructure'},{value:'event',label:'Event'}])}${formInput('Priority', data.priority, 'priority', 'select', [{value:'high',label:'High'},{value:'medium',label:'Medium'},{value:'low',label:'Low'}])}${formInput('Date', data.date, 'date')}</div>`,
        () => { const v = getForm(); if (!v.title) { alert('Title required'); return; } db.announcements.add(v); toast('Announcement posted'); closeModal(); render(); }
      );
    }

          <h3 class="text-base font-bold text-slate-800 mb-1">Notification Preferences</h3>

          <div class="space-y-3">
