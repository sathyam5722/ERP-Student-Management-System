<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOD Dashboard | AMC Engineering College</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .slide { transition: transform 0.3s ease; }
    .fade { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .pop { animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .brand-grad { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%); }
    .brand-grad-soft { background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 100%); }
    .glass { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.85); }
    .nav-item { position: relative; transition: all 0.2s ease; }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 24px; background: linear-gradient(180deg, #6366f1, #8b5cf6); border-radius: 0 4px 4px 0; }
    .stat-icon { transition: transform 0.3s ease; }
    .stat-card:hover .stat-icon { transform: scale(1.1) rotate(-5deg); }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.15); }
    .ring-glow { box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12); }
    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .gradient-text { background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .table-row { transition: background 0.15s; }
    .table-row:hover { background: linear-gradient(90deg, #eef2ff 0%, transparent 100%); }
  </style>
</head>
<body>
  <div id="app" class="flex h-screen overflow-hidden"></div>

  <script src="auth.js"></script>
  <script src="leader-ui.js"></script>
  <script>
    // ═══════════════════════════════════════════════════════════════════════
    // HOD DASHBOARD — all data comes from the backend, scoped to the HOD's department
    // ═══════════════════════════════════════════════════════════════════════
    const ERP_SESSION = ErpAuth.requireRole(['hod']);
    const UI = LeaderUI;
    const { esc, fmt } = UI;
    const api = ErpAuth.api;

    let me = ERP_SESSION || {};
    let page = 'dashboard';
    let sidebarOpen = false;
    let ov = null;              // /api/hod-portal/overview
    let notifications = [];
    let cache = {};             // per-page data (subjects, events, ...)
    let studentYear = 'all';
    let leaveFilter = 'pending';

    const NAV = [
      { id: 'dashboard', label: 'Dashboard', icon: 'home' },
      { id: 'faculty', label: 'Faculty', icon: 'users' },
      { id: 'students', label: 'Students', icon: 'book' },
      { id: 'subjects', label: 'Subjects & Allocation', icon: 'clipboard' },
      { id: 'leaves', label: 'Leave Requests', icon: 'doc' },
      { id: 'exams', label: 'Exams', icon: 'exam' },
      { id: 'analytics', label: 'Analytics & Reports', icon: 'chart' },
      { id: 'events', label: 'Events', icon: 'calendar' },
      { id: 'announcements', label: 'Announcements', icon: 'megaphone' },
      { id: 'settings', label: 'Settings', icon: 'cog' },
    ];
    const TITLES = {
      dashboard: ["Dashboard", "Today's overview & key metrics"], faculty: ['Faculty Management', 'Department faculty members'],
      students: ['Students', 'Performance & attendance'], subjects: ['Subjects & Allocation', 'Who teaches what'],
      leaves: ['Leave Requests', 'Review faculty leave and apply for your own'], exams: ['Exams', 'Department exam timetable'],
      analytics: ['Analytics & Reports', 'Insights and downloadable reports'], events: ['Events', 'Department events'],
      announcements: ['Announcements', 'Department notices'], settings: ['Settings', 'Profile & password'],
    };

    // ---------- data & navigation ----------
    async function refresh() {
      try {
        const [o, n, profile] = await Promise.all([api('/api/hod-portal/overview'), api('/api/notifications'), api('/api/auth/me')]);
        ov = o; notifications = n; me = profile.user;
        render();
      } catch (error) {
        UI.toast(error.message, 'error');
      }
    }

    function go(p) { page = p; sidebarOpen = false; render(); }
    function toggleSidebar() { sidebarOpen = !sidebarOpen; render(); }
    function logout() { if (confirm('Logout from dashboard?')) ErpAuth.logout(); }
    window.onProfileSaved = (user) => { me = user; render(); };

    function render() {
      if (!ERP_SESSION || !ov) return;
      NAV.find((n) => n.id === 'leaves').badge = ov.leaves.filter((l) => l.status === 'pending').length;
      const [title, subtitle] = TITLES[page];
      UI.shell({
        brand: 'EduPortal', subtitle: 'HOD Dashboard', infoTitle: 'Department', infoValue: ov.department || 'Not set',
        infoMeta: `${ov.faculty.length} faculty • ${ov.students.length} students`, nav: NAV, page, user: me, roleLabel: `HOD${ov.department ? ', ' + ov.department : ''}`,
        notifications, sidebarOpen, title, subtitleText: subtitle,
        notificationPage: (n) => ({ leaves: 'leaves', students: 'students', notices: 'announcements' }[n.section] || 'dashboard'),
      });
      const el = document.getElementById('mainContent');
      ({ dashboard: renderDashboard, faculty: renderFaculty, students: renderStudents, subjects: renderSubjects, leaves: renderLeaves,
         exams: renderExams, analytics: renderAnalytics, events: renderEvents, announcements: renderAnnouncements, settings: (e) => { e.innerHTML = UI.settingsPage(me, `HOD, ${ov.department || ''}`); } }[page])(el);
    }

    const head = (title, sub, action) => `<div class="flex items-center justify-between flex-wrap gap-4"><div><h3 class="text-2xl font-extrabold text-slate-800">${title}</h3><p class="text-sm text-slate-500 mt-1">${sub}</p></div>${action || ''}</div>`;
    const leaveRow = (l, actions) => `<div class="px-6 py-4 hover:bg-slate-50/50 transition" data-row>
        <div class="flex items-start gap-4">${UI.avatar(l.applicantName)}
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap"><p class="text-sm font-bold text-slate-800">${esc(l.applicantName)}</p>
              <span class="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 bg-violet-50 text-violet-700 rounded">${esc(l.type)} leave</span>${UI.pill(l.status)}</div>
            <p class="text-xs text-slate-500 mt-1">${fmt(l.from)} → ${fmt(l.to)} • ${l.days} day(s) • applied ${fmt(l.createdAt)}</p>
            <p class="text-xs text-slate-500 mt-1 italic">"${esc(l.reason)}"</p>
            ${l.reviewerName ? `<p class="text-[11px] text-slate-400 mt-1">Reviewed by ${esc(l.reviewerName)}${l.reviewNote ? ` — ${esc(l.reviewNote)}` : ''}</p>` : ''}
          </div>
          ${actions && l.status === 'pending' ? `<div class="flex gap-2 flex-shrink-0">${UI.button('Approve', `reviewLeave('${l._id}','approved')`, 'ok')}${UI.button('Reject', `reviewLeave('${l._id}','rejected')`, 'no')}</div>` : ''}
        </div></div>`;

    // ---------- DASHBOARD ----------
    function renderDashboard(el) {
      const pending = ov.leaves.filter((l) => l.status === 'pending');
      const atRisk = ov.students.filter((s) => s.atRisk);
      const allocated = new Set(ov.allocations.map((a) => `${a.subjectCode}-${a.semester}-${a.section}`)).size;
      const totalGrades = ov.grades.reduce((s, g) => s + g.count, 0);
      const gColors = { A: 'bg-emerald-500', B: 'bg-sky-500', C: 'bg-amber-500', D: 'bg-orange-500', F: 'bg-red-500' };
      const hour = new Date().getHours();

      el.innerHTML = `<div class="space-y-7 fade">
        <div class="brand-grad rounded-3xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden">
          <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/4"></div>
          <div class="relative z-10">
            <p class="text-violet-100 text-sm font-medium">${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
            <h2 class="text-2xl sm:text-3xl font-extrabold mt-1">Good ${hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening'}, ${esc(me.name)} 👋</h2>
            <p class="text-violet-100 mt-2 max-w-xl">You have <strong class="text-white">${pending.length} pending leave request(s)</strong> and <strong class="text-white">${atRisk.length} at-risk student(s)</strong> to review.</p>
            <div class="flex flex-wrap gap-3 mt-5">
              <button onclick="go('leaves')" class="px-4 py-2 bg-white text-violet-700 text-sm font-bold rounded-xl shadow hover:shadow-lg transition">Review Leaves</button>
              <button onclick="studentYear='risk'; go('students')" class="px-4 py-2 bg-white/20 text-white text-sm font-semibold rounded-xl hover:bg-white/30 transition border border-white/30">View At-Risk Students</button>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          ${UI.statCard({ label: 'Total Faculty', value: ov.faculty.filter((f) => f.status !== 'inactive').length, sub: `${ov.faculty.filter((f) => f.onLeave).length} on leave`, iconName: 'users', gradient: 'from-violet-500 to-purple-600', go: 'faculty' })}
          ${UI.statCard({ label: 'Total Students', value: ov.students.filter((s) => s.status !== 'inactive').length, sub: `${atRisk.length} at risk`, iconName: 'book', gradient: 'from-sky-500 to-blue-600', go: 'students' })}
          ${UI.statCard({ label: 'Classes Allocated', value: allocated, sub: 'subject-sections', iconName: 'clipboard', gradient: 'from-emerald-500 to-teal-600', go: 'subjects' })}
          ${UI.statCard({ label: 'Avg. Attendance', value: ov.avgAttendance === null ? '—' : `${ov.avgAttendance}%`, sub: ov.passRate === null ? '' : `${ov.passRate}% pass`, iconName: 'check', gradient: 'from-amber-500 to-orange-600', go: 'analytics' })}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2">${UI.panel('Daily Attendance <span class="text-xs font-normal text-slate-400">(last class days)</span>', UI.bars(ov.weekly, '%', 100), UI.link('Analytics', 'analytics'))}</div>
          ${UI.panel('Grade Distribution', totalGrades ? `<div class="p-6">
              <div class="flex h-3 rounded-full overflow-hidden mb-5 bg-slate-100">${ov.grades.map((g) => `<div class="${gColors[g.grade]}" style="width:${(g.count / totalGrades) * 100}%"></div>`).join('')}</div>
              <div class="space-y-3">${ov.grades.map((g) => `<div class="flex items-center justify-between text-sm"><div class="flex items-center gap-2.5"><span class="h-3 w-3 rounded-full ${gColors[g.grade]}"></span><span class="font-semibold text-slate-700">Grade ${g.grade}</span></div>
                <div class="flex items-center gap-3"><span class="text-xs text-slate-400">${Math.round((g.count / totalGrades) * 100)}%</span><span class="text-sm font-bold text-slate-800 min-w-[2rem] text-right">${g.count}</span></div></div>`).join('')}</div>
              <p class="text-[11px] text-slate-400 mt-4">Per student per subject, from internal marks</p></div>` : UI.empty('No marks entered yet'))}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2">${UI.panel(`Pending Leave Requests <span class="px-2 py-0.5 bg-red-100 text-red-700 text-xs font-bold rounded-full">${pending.length}</span>`,
            pending.length ? `<div class="divide-y divide-slate-50 max-h-[400px] overflow-y-auto">${pending.slice(0, 4).map((l) => leaveRow(l, true)).join('')}</div>` : UI.empty('No pending leave requests'), UI.link('View All', 'leaves'))}</div>
          ${UI.panel('Notifications', notifications.length ? `<div class="divide-y divide-slate-50 max-h-[400px] overflow-y-auto">${notifications.map((n) => `<div class="px-6 py-4 hover:bg-slate-50 cursor-pointer" onclick="go('${({ leaves: 'leaves', students: 'students', notices: 'announcements' })[n.section] || 'dashboard'}')">
              <p class="text-sm text-slate-700">${esc(n.message)}</p><p class="text-[11px] text-slate-400 mt-1">${ErpAuth.timeAgo(n.at)}</p></div>`).join('')}</div>` : UI.empty('You are all caught up'))}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2">${UI.panel('Faculty Overview', facultyTable(ov.faculty.slice(0, 6)), UI.link('View All', 'faculty'))}</div>
          ${UI.panel('Upcoming Events', ov.events.length ? `<div class="p-4 space-y-3">${ov.events.map((e) => `<div class="flex items-center gap-3 p-3 rounded-2xl hover:bg-slate-50 cursor-pointer" onclick="go('events')">
              <div class="text-center min-w-[44px]"><p class="text-[10px] font-bold text-violet-600 uppercase">${new Date(e.date).toLocaleString('en-US', { month: 'short' })}</p><p class="text-xl font-extrabold text-slate-800 leading-none mt-0.5">${new Date(e.date).getDate()}</p></div>
              <div class="flex-1 min-w-0 border-l-2 border-slate-100 pl-3"><p class="text-sm font-bold text-slate-800 truncate">${esc(e.title)}</p><p class="text-xs text-slate-400 mt-0.5">${esc([e.time, e.location].filter(Boolean).join(' • '))}</p></div></div>`).join('')}</div>` : UI.empty('No upcoming events'), UI.link('View All', 'events'))}
        </div>
      </div>`;
    }

    function facultyTable(list) {
      if (!list.length) return UI.empty('No faculty in this department yet');
      return `<div class="overflow-x-auto"><table class="w-full"><thead><tr class="text-[10px] uppercase tracking-wider text-slate-400 bg-slate-50/50">
        <th class="text-left px-6 py-3 font-bold">Faculty</th><th class="text-left px-6 py-3 font-bold">Designation</th><th class="text-left px-6 py-3 font-bold">Classes</th><th class="text-left px-6 py-3 font-bold">Status</th></tr></thead>
        <tbody class="divide-y divide-slate-50">${list.map((f) => `<tr class="table-row" data-row><td class="px-6 py-3.5"><div class="flex items-center gap-3">${UI.avatar(f.name, 'sm')}<div><p class="text-sm font-bold text-slate-800">${esc(f.name)}</p><p class="text-xs text-slate-400">${esc(f.email)}</p></div></div></td>
          <td class="px-6 py-3.5 text-sm text-slate-600">${esc(f.designation || '—')}</td>
          <td class="px-6 py-3.5"><span class="px-2.5 py-1 bg-violet-50 text-violet-700 text-xs font-bold rounded-lg">${f.subjects}</span></td>
          <td class="px-6 py-3.5">${UI.pill(f.status === 'inactive' ? 'inactive' : f.onLeave ? 'on_leave' : 'active')}</td></tr>`).join('')}</tbody></table></div>`;
    }

    // ---------- FACULTY ----------
    function renderFaculty(el) {
      const items = ov.faculty;
      el.innerHTML = `<div class="space-y-6 fade">
        ${head('Faculty Members', `${items.filter((f) => f.status !== 'inactive').length} active in ${esc(ov.department)}`, UI.button('+ Add Faculty', 'facultyForm()'))}
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          ${items.length ? items.map((f) => `<div class="card-hover bg-white rounded-3xl border border-slate-100 p-6 shadow-sm ${f.status === 'inactive' ? 'opacity-60' : ''}" data-row>
            <div class="flex items-start justify-between mb-4">
              <div class="flex items-center gap-3">${UI.avatar(f.name, 'lg')}<div><p class="font-bold text-slate-800">${esc(f.name)}</p><p class="text-xs text-slate-500 mt-0.5">${esc(f.designation || 'Faculty')}</p></div></div>
              <div class="flex gap-1">${UI.iconButton('edit', `facultyForm('${f._id}')`, 'Edit')}
                ${f.status === 'inactive' ? UI.iconButton('check', `setFacultyActive('${f._id}', true)`, 'Reactivate', 'text-emerald-500 hover:bg-emerald-50') : UI.iconButton('trash', `setFacultyActive('${f._id}', false)`, 'Deactivate', 'text-red-400 hover:bg-red-50')}</div>
            </div>
            <div class="space-y-1.5 text-xs text-slate-600"><p>✉ ${esc(f.email)}</p><p>☎ ${esc(f.phone || '—')}</p><p>🆔 ${esc(f.facultyId || '—')}</p></div>
            <div class="flex justify-between items-center mt-4 pt-4 border-t border-slate-100">${UI.pill(f.status === 'inactive' ? 'inactive' : f.onLeave ? 'on_leave' : 'active')}
              <button class="text-xs font-bold text-violet-600" onclick="go('subjects')">${f.subjects} class(es) →</button></div>
          </div>`).join('') : `<div class="col-span-3">${UI.empty('No faculty yet')}</div>`}
        </div></div>`;
    }

    function facultyForm(id) {
      const f = id ? ov.faculty.find((x) => x._id === id) : null;
      UI.showForm({
        title: f ? 'Edit Faculty' : `Add Faculty to ${ov.department}`,
        values: f || {},
        fields: [
          { name: 'name', label: 'Full Name', required: true },
          { name: 'email', label: 'Email (login)', type: 'email', required: true, half: true },
          { name: 'facultyId', label: 'Faculty ID', half: true },
          { name: 'designation', label: 'Designation', type: 'select', default: 'Assistant Professor', half: true, options: ['Professor', 'Associate Professor', 'Assistant Professor', 'Lecturer'].map((v) => ({ value: v, label: v })) },
          { name: 'phone', label: 'Phone', half: true },
          ...(f ? [] : [{ name: 'password', label: 'Initial Password', default: 'faculty123', hint: 'They can change it after logging in' }]),
        ],
        onSave: async (v) => {
          await api(f ? `/api/faculty/${f._id}` : '/api/faculty', { method: f ? 'PATCH' : 'POST', body: v });
          UI.toast(f ? 'Faculty updated' : 'Faculty added');
          refresh();
        },
      });
    }

    async function setFacultyActive(id, active) {
      if (!confirm(active ? 'Reactivate this faculty member?' : 'Deactivate this faculty member? They will not be able to log in.')) return;
      try {
        await api(`/api/faculty/${active ? 'reactivate' : 'inactive'}/${id}`, { method: 'PATCH' });
        UI.toast(active ? 'Faculty reactivated' : 'Faculty deactivated');
        refresh();
      } catch (error) { UI.toast(error.message, 'error'); }
    }

    // ---------- STUDENTS ----------
    function renderStudents(el) {
      const all = ov.students;
      const list = all.filter((s) => studentYear === 'all' ? true : studentYear === 'risk' ? s.atRisk : String(Math.ceil((s.semester || 0) / 2)) === studentYear);
      el.innerHTML = `<div class="space-y-6 fade">
        ${head('Students', `${all.length} in ${esc(ov.department)} • ${all.filter((s) => s.atRisk).length} at risk (attendance &lt; 75% or marks &lt; 40%)`, `<div class="flex gap-3">
          <select onchange="studentYear=this.value; render()" class="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white">
            ${[['all', 'All Years'], ['1', 'Year 1'], ['2', 'Year 2'], ['3', 'Year 3'], ['4', 'Year 4'], ['risk', 'At risk only']].map(([v, l]) => `<option value="${v}" ${studentYear === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select>${UI.button('+ Add Student', 'studentForm()')}</div>`)}
        <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden"><div class="overflow-x-auto"><table class="w-full">
          <thead><tr class="text-[10px] uppercase tracking-wider text-slate-400 bg-slate-50/50"><th class="text-left px-6 py-3.5 font-bold">Student</th><th class="text-left px-6 py-3.5 font-bold">ID</th><th class="text-left px-6 py-3.5 font-bold">Sem / Sec</th><th class="text-left px-6 py-3.5 font-bold">Marks</th><th class="text-left px-6 py-3.5 font-bold">Attendance</th><th class="text-left px-6 py-3.5 font-bold">Status</th><th class="text-right px-6 py-3.5 font-bold">Actions</th></tr></thead>
          <tbody class="divide-y divide-slate-50">${list.length ? list.map((s) => `<tr class="table-row" data-row>
            <td class="px-6 py-4"><div class="flex items-center gap-3">${UI.avatar(s.name, 'sm')}<div><p class="text-sm font-bold text-slate-800">${esc(s.name)}</p><p class="text-xs text-slate-400">${esc(s.email)}</p></div></div></td>
            <td class="px-6 py-4 text-sm font-mono font-semibold text-slate-600">${esc(s.studentId || '—')}</td>
            <td class="px-6 py-4"><span class="px-2.5 py-1 bg-violet-50 text-violet-700 text-xs font-bold rounded-lg">${s.semester ? `Sem ${s.semester}${s.section ? ' / ' + esc(s.section) : ''}` : 'Not set'}</span></td>
            <td class="px-6 py-4">${UI.progress(s.marksPct)}</td>
            <td class="px-6 py-4">${UI.progress(s.attendancePct)}</td>
            <td class="px-6 py-4">${UI.pill(s.status === 'inactive' ? 'inactive' : s.atRisk ? 'at_risk' : 'active')}</td>
            <td class="px-6 py-4 text-right"><div class="flex justify-end gap-1">${UI.iconButton('edit', `studentForm('${s._id}')`, 'Edit')}
              ${s.status === 'inactive' ? UI.iconButton('check', `setStudentActive('${s._id}', true)`, 'Reactivate', 'text-emerald-500 hover:bg-emerald-50') : UI.iconButton('trash', `setStudentActive('${s._id}', false)`, 'Deactivate', 'text-red-400 hover:bg-red-50')}</div></td>
          </tr>`).join('') : `<tr><td colspan="7">${UI.empty('No students match')}</td></tr>`}</tbody></table></div></div></div>`;
    }

    function studentForm(id) {
      const s = id ? ov.students.find((x) => x._id === id) : null;
      UI.showForm({
        title: s ? 'Edit Student' : `Add Student to ${ov.department}`,
        values: s || {},
        fields: [
          { name: 'name', label: 'Full Name', required: true },
          { name: 'email', label: 'Email (login)', type: 'email', required: true, half: true },
          { name: 'studentId', label: 'Student ID / USN', required: true, half: true },
          { name: 'semester', label: 'Semester', type: 'number', min: 1, max: 8, required: true, half: true },
          { name: 'section', label: 'Section', type: 'select', default: 'A', half: true, options: ['A', 'B', 'C', 'D'].map((v) => ({ value: v, label: v })) },
          { name: 'phone', label: 'Phone', half: true },
          { name: 'enrollmentDate', label: 'Enrollment Date', type: 'date', half: true },
        ],
        onSave: async (v) => {
          await api(s ? `/api/students/${s._id}` : '/api/students', { method: s ? 'PATCH' : 'POST', body: v });
          UI.toast(s ? 'Student updated' : 'Student added (default password: student123)');
          refresh();
        },
      });
    }

    async function setStudentActive(id, active) {
      if (!confirm(active ? 'Reactivate this student?' : 'Deactivate this student?')) return;
      try {
        await api(`/api/students/${active ? 'reactivate' : 'inactive'}/${id}`, { method: 'PATCH' });
        UI.toast(active ? 'Student reactivated' : 'Student deactivated');
        refresh();
      } catch (error) { UI.toast(error.message, 'error'); }
    }

    // ---------- SUBJECTS & ALLOCATION ----------
    async function renderSubjects(el) {
      el.innerHTML = `<div class="fade">${UI.empty('Loading subjects...')}</div>`;
      try { cache.subjects = await api('/api/subjects'); } catch (error) { el.innerHTML = UI.empty(error.message); return; }
      const subjects = cache.subjects.filter((s) => !s.department || s.department.toLowerCase() === (ov.department || '').toLowerCase());
      const allocFor = (code) => ov.allocations.filter((a) => a.subjectCode === code);
      const sems = [...new Set(subjects.map((s) => s.semester))].sort((a, b) => a - b);
      el.innerHTML = `<div class="space-y-6 fade">
        ${head('Subjects & Allocation', `${subjects.length} subjects • ${ov.allocations.length} class allocations to your faculty`, `<div class="flex gap-2">${UI.button('+ Allocate Faculty', 'allocateForm()')}${UI.button('+ Add Subject', 'subjectForm()', 'soft')}</div>`)}
        ${sems.map((sem) => `<div><h4 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">Semester ${sem}</h4>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">${subjects.filter((s) => s.semester === sem).map((s) => `<div class="card-hover bg-white rounded-3xl border border-slate-100 p-6 shadow-sm" data-row>
            <p class="text-xs font-mono font-bold text-slate-400">${esc(s.code)} • ${s.credits} credits</p>
            <h4 class="text-lg font-extrabold text-slate-800 leading-tight mt-1">${esc(s.name)}</h4>
            <div class="mt-4 pt-4 border-t border-slate-100 space-y-2">${allocFor(s.code).length ? allocFor(s.code).map((a) => `<div class="flex items-center justify-between text-sm">
                <span><span class="px-2 py-0.5 bg-violet-50 text-violet-700 text-xs font-bold rounded">Sec ${esc(a.section)}</span> ${esc(a.faculty.name)}</span>
                ${UI.iconButton('trash', `removeAllocation('${a._id}')`, 'Remove', 'text-red-400 hover:bg-red-50')}</div>`).join('') : '<p class="text-xs text-slate-400">No faculty allocated</p>'}
              <button onclick="allocateForm('${s.code}')" class="text-xs font-bold text-violet-600">+ Allocate</button></div>
          </div>`).join('')}</div></div>`).join('') || UI.empty('No subjects yet')}
      </div>`;
    }

    function allocateForm(code) {
      const active = ov.faculty.filter((f) => f.status !== 'inactive');
      if (!active.length) return UI.toast('Add faculty to your department first', 'error');
      const subject = code ? cache.subjects.find((s) => s.code === code) : null;
      UI.showForm({
        title: 'Allocate Faculty to a Class', saveLabel: 'Allocate',
        values: { subjectCode: code || '', semester: subject ? subject.semester : '' },
        fields: [
          { name: 'subjectCode', label: 'Subject', type: 'select', required: true, options: cache.subjects.map((s) => ({ value: s.code, label: `${s.code} - ${s.name} (Sem ${s.semester})` })) },
          { name: 'faculty', label: 'Faculty', type: 'select', required: true, options: active.map((f) => ({ value: f._id, label: f.name })) },
          { name: 'section', label: 'Section', type: 'select', default: 'A', half: true, options: ['A', 'B', 'C', 'D'].map((v) => ({ value: v, label: v })) },
        ],
        onSave: async (v) => {
          const s = cache.subjects.find((x) => x.code === v.subjectCode);
          const res = await api('/api/allocations/toggle', { method: 'POST', body: { ...v, semester: s.semester } });
          if (!res.allocated) throw new Error('That faculty already had this class, so it was removed. Allocate again to restore it.');
          UI.toast('Class allocated');
          await refresh();
        },
      });
    }

    async function removeAllocation(id) {
      if (!confirm('Remove this allocation?')) return;
      try { await api(`/api/allocations/${id}`, { method: 'DELETE' }); UI.toast('Allocation removed'); refresh(); } catch (error) { UI.toast(error.message, 'error'); }
    }

    function subjectForm() {
      UI.showForm({
        title: 'Add Subject',
        fields: [
          { name: 'code', label: 'Subject Code', required: true, half: true },
          { name: 'credits', label: 'Credits', type: 'number', default: 3, min: 1, max: 6, half: true },
          { name: 'name', label: 'Subject Name', required: true },
          { name: 'semester', label: 'Semester', type: 'number', min: 1, max: 8, required: true, half: true },
        ],
        onSave: async (v) => { await api('/api/subjects', { method: 'POST', body: { ...v, department: ov.department } }); UI.toast('Subject added'); render(); },
      });
    }

    // ---------- LEAVES ----------
    async function renderLeaves(el) {
      let mine = [];
      try { mine = await api('/api/leaves/mine'); } catch (_) { /* optional */ }
      const items = ov.leaves.filter((l) => leaveFilter === 'all' || l.status === leaveFilter);
      const count = (s) => ov.leaves.filter((l) => l.status === s).length;
      const box = (s, label, color) => `<button onclick="leaveFilter='${s}'; render()" class="text-left bg-white rounded-2xl border ${leaveFilter === s ? 'border-violet-400 ring-2 ring-violet-100' : 'border-slate-100'} p-5 shadow-sm">
          <p class="text-xs font-bold uppercase ${color}">${label}</p><p class="text-3xl font-extrabold text-slate-800 mt-2">${s === 'all' ? ov.leaves.length : count(s)}</p></button>`;
      el.innerHTML = `<div class="space-y-6 fade">
        ${head('Leave Requests', 'Faculty requests from your department', UI.button('Apply for My Leave', 'myLeaveForm()'))}
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">${box('pending', 'Pending', 'text-amber-600')}${box('approved', 'Approved', 'text-emerald-600')}${box('rejected', 'Rejected', 'text-red-600')}${box('all', 'All', 'text-slate-500')}</div>
        ${UI.panel('Faculty Requests', items.length ? `<div class="divide-y divide-slate-50">${items.map((l) => leaveRow(l, true)).join('')}</div>` : UI.empty('No requests here'))}
        ${UI.panel('My Leave Requests <span class="text-xs font-normal text-slate-400">(reviewed by the Principal)</span>', mine.length ? `<div class="divide-y divide-slate-50">${mine.map((l) => leaveRow(l, false)).join('')}</div>` : UI.empty('You have not applied for leave'))}
      </div>`;
    }

    async function reviewLeave(id, status) {
      const note = status === 'rejected' ? prompt('Reason for rejecting (optional):', '') : '';
      if (note === null) return;
      try { await api(`/api/leaves/${id}/review`, { method: 'PATCH', body: { status, note } }); UI.toast(`Leave ${status}`, status === 'approved' ? 'success' : 'info'); refresh(); } catch (error) { UI.toast(error.message, 'error'); }
    }

    function myLeaveForm() {
      UI.showForm({
        title: 'Apply for Leave', saveLabel: 'Send to Principal',
        fields: [
          { name: 'type', label: 'Leave Type', type: 'select', default: 'casual', options: ['casual', 'sick', 'earned', 'academic', 'conference', 'emergency', 'other'].map((v) => ({ value: v, label: v[0].toUpperCase() + v.slice(1) })) },
          { name: 'from', label: 'From', type: 'date', required: true, half: true },
          { name: 'to', label: 'To', type: 'date', required: true, half: true },
          { name: 'reason', label: 'Reason', type: 'textarea', required: true },
        ],
        onSave: async (v) => { await api('/api/leaves', { method: 'POST', body: v }); UI.toast('Leave request sent'); render(); },
      });
    }

    // ---------- EXAMS ----------
    async function renderExams(el) {
      try { cache.exams = await api('/api/exams'); cache.subjects = cache.subjects || await api('/api/subjects'); } catch (error) { el.innerHTML = UI.empty(error.message); return; }
      el.innerHTML = `<div class="space-y-6 fade">${head('Exam Timetable', `${cache.exams.length} exams visible to your department`, UI.button('+ Schedule Exam', 'examForm()'))}
        <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-x-auto"><table class="w-full">
        <thead><tr class="text-[10px] uppercase tracking-wider text-slate-400 bg-slate-50/50">${['Date', 'Subject', 'Sem', 'Type', 'Time', 'Venue', 'Scope', ''].map((h) => `<th class="text-left px-6 py-3.5 font-bold">${h}</th>`).join('')}</tr></thead>
        <tbody class="divide-y divide-slate-50">${cache.exams.length ? cache.exams.map((x) => `<tr class="table-row" data-row>
          <td class="px-6 py-3.5 text-sm font-semibold">${fmt(x.date)}</td><td class="px-6 py-3.5 text-sm">${esc(x.subjectName || '')} <span class="text-xs text-slate-400">${esc(x.subjectCode)}</span></td>
          <td class="px-6 py-3.5 text-sm">${x.semester}</td><td class="px-6 py-3.5 text-sm">${esc(x.examType)}</td><td class="px-6 py-3.5 text-sm">${esc([x.startTime, x.endTime].filter(Boolean).join(' - ') || '—')}</td>
          <td class="px-6 py-3.5 text-sm">${esc(x.venue || '—')}</td><td class="px-6 py-3.5 text-xs">${esc(x.department || 'College-wide')}</td>
          <td class="px-6 py-3.5 text-right">${x.department ? UI.iconButton('trash', `deleteItem('exams','${x._id}')`, 'Delete', 'text-red-400 hover:bg-red-50') : ''}</td></tr>`).join('') : `<tr><td colspan="8">${UI.empty('No exams scheduled')}</td></tr>`}</tbody></table></div></div>`;
    }

    function examForm() {
      UI.showForm({
        title: 'Schedule Exam',
        fields: [
          { name: 'subjectCode', label: 'Subject', type: 'select', required: true, options: cache.subjects.map((s) => ({ value: s.code, label: `${s.code} - ${s.name} (Sem ${s.semester})` })) },
          { name: 'examType', label: 'Type', type: 'select', default: 'internal', half: true, options: [['internal', 'Internal'], ['semester', 'Semester End'], ['practical', 'Practical']].map(([value, label]) => ({ value, label })) },
          { name: 'date', label: 'Date', type: 'date', required: true, half: true },
          { name: 'startTime', label: 'Start', type: 'time', half: true },
          { name: 'endTime', label: 'End', type: 'time', half: true },
          { name: 'venue', label: 'Venue' },
        ],
        onSave: async (v) => {
          const s = cache.subjects.find((x) => x.code === v.subjectCode);
          await api('/api/exams', { method: 'POST', body: { ...v, semester: s.semester } });
          UI.toast('Exam scheduled — students of that semester can see it');
          render();
        },
      });
    }

    // ---------- ANALYTICS ----------
    function renderAnalytics(el) {
      const students = ov.students.filter((s) => s.status !== 'inactive');
      const faculty = ov.faculty.filter((f) => f.status !== 'inactive');
      const withMarks = students.filter((s) => s.marksPct !== null);
      const avgMarks = withMarks.length ? Math.round(withMarks.reduce((a, s) => a + s.marksPct, 0) / withMarks.length) : null;
      const ranges = [['85% and above', (p) => p >= 85, 'bg-emerald-500'], ['70 - 84%', (p) => p >= 70 && p < 85, 'bg-sky-500'], ['40 - 69%', (p) => p >= 40 && p < 70, 'bg-amber-500'], ['Below 40%', (p) => p < 40, 'bg-red-500']];
      const reportBtn = (type, label) => `<button onclick="LeaderUI.download('${type}', '${label}')" class="flex items-center gap-3 p-4 rounded-2xl border border-slate-100 hover:border-violet-300 hover:bg-violet-50/40 text-left transition">
          <span class="h-10 w-10 rounded-xl bg-violet-100 text-violet-600 flex items-center justify-center">${UI.icon('download')}</span><span><span class="block text-sm font-bold text-slate-800">${label}</span><span class="text-xs text-slate-400">CSV for ${esc(ov.department)}</span></span></button>`;
      el.innerHTML = `<div class="space-y-6 fade">
        ${head('Analytics & Insights', `Department-wide performance for ${esc(ov.department)}`)}
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          ${UI.statCard({ label: 'Pass Rate', value: ov.passRate === null ? '—' : `${ov.passRate}%`, sub: 'marks ≥ 40%', iconName: 'check', gradient: 'from-emerald-500 to-green-600' })}
          ${UI.statCard({ label: 'Average Marks', value: avgMarks === null ? '—' : `${avgMarks}%`, iconName: 'chart', gradient: 'from-amber-500 to-orange-600' })}
          ${UI.statCard({ label: 'Faculty : Student', value: faculty.length ? `1 : ${Math.round(students.length / faculty.length)}` : '—', iconName: 'users', gradient: 'from-violet-500 to-purple-600' })}
          ${UI.statCard({ label: 'At-Risk Students', value: students.filter((s) => s.atRisk).length, iconName: 'bell', gradient: 'from-red-500 to-rose-600', go: 'students' })}
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          ${UI.panel('Attendance by Day', UI.bars(ov.weekly, '%', 100))}
          ${UI.panel('Marks Distribution (students)', withMarks.length ? `<div class="p-6 space-y-4">${ranges.map(([label, test, color]) => { const n = withMarks.filter((s) => test(s.marksPct)).length; return `<div><div class="flex justify-between text-sm mb-2"><span class="font-semibold text-slate-700">${label}</span><span class="font-bold text-slate-800">${n} students</span></div><div class="h-3 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${color} rounded-full" style="width:${(n / withMarks.length) * 100}%"></div></div></div>`; }).join('')}</div>` : UI.empty('No marks yet'))}
        </div>
        ${UI.panel('Subject Performance (average internal marks)', UI.hbars(ov.subjectPerformance.map((s) => ({ label: s.code, sub: `${s.name} • ${s.passRate}% pass`, value: s.average })), '%'))}
        ${UI.panel('Download Reports', `<div class="p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${reportBtn('students', 'Students')}${reportBtn('attendance', 'Attendance')}${reportBtn('marks', 'Internal Marks')}${reportBtn('faculty', 'Faculty')}${reportBtn('fees', 'Fees')}${reportBtn('leaves', 'Leave')}</div>`)}
      </div>`;
    }

    // ---------- EVENTS & ANNOUNCEMENTS ----------
    async function renderEvents(el) {
      try { cache.events = await api('/api/events'); } catch (error) { el.innerHTML = UI.empty(error.message); return; }
      const grad = { meeting: 'from-sky-500 to-blue-600', exam: 'from-red-500 to-rose-600', workshop: 'from-emerald-500 to-teal-600', holiday: 'from-slate-500 to-slate-600' };
      el.innerHTML = `<div class="space-y-6 fade">${head('Events Calendar', `${cache.events.length} events`, UI.button('+ Add Event', 'eventForm()'))}
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">${cache.events.length ? cache.events.map((e) => `<div class="card-hover bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden" data-row>
          <div class="bg-gradient-to-br ${grad[e.type] || 'from-violet-500 to-purple-600'} p-5 text-white">
            <div class="flex justify-between items-start"><p class="text-xs font-bold uppercase opacity-90">${esc(e.type)} • ${esc(e.audience)}</p>
              <div class="text-center bg-white/20 rounded-xl p-2 min-w-[60px]"><p class="text-[10px] font-bold">${new Date(e.date).toLocaleString('en-US', { month: 'short' })}</p><p class="text-2xl font-extrabold leading-none mt-0.5">${new Date(e.date).getDate()}</p></div></div>
            <h4 class="text-lg font-extrabold mt-4">${esc(e.title)}</h4></div>
          <div class="p-5 space-y-2 text-sm text-slate-600"><p>🕒 ${esc(e.time || 'All day')}${e.endDate ? ` • until ${fmt(e.endDate)}` : ''}</p><p>📍 ${esc(e.location || '—')}</p>${e.description ? `<p class="text-xs text-slate-500">${esc(e.description)}</p>` : ''}
            <div class="flex justify-between items-center pt-2 border-t border-slate-100"><span class="text-xs text-slate-400">${esc(e.department || 'College-wide')}</span>
            ${e.department ? UI.iconButton('trash', `deleteItem('events','${e._id}')`, 'Delete', 'text-red-400 hover:bg-red-50') : ''}</div></div>
        </div>`).join('') : `<div class="col-span-3">${UI.empty('No events')}</div>`}</div></div>`;
    }

    function eventForm() {
      UI.showForm({
        title: 'Add Department Event',
        fields: [
          { name: 'title', label: 'Event Title', required: true },
          { name: 'date', label: 'Date', type: 'date', required: true, half: true },
          { name: 'endDate', label: 'End Date (optional)', type: 'date', half: true },
          { name: 'time', label: 'Time', placeholder: '10:00 AM', half: true },
          { name: 'location', label: 'Location', half: true },
          { name: 'type', label: 'Type', type: 'select', default: 'meeting', half: true, options: ['meeting', 'workshop', 'academic', 'exam', 'tech', 'cultural', 'sports', 'holiday', 'other'].map((v) => ({ value: v, label: v })) },
          { name: 'audience', label: 'Visible to', type: 'select', default: 'all', half: true, options: [['all', 'Everyone'], ['students', 'Students'], ['faculty', 'Faculty']].map(([value, label]) => ({ value, label })) },
          { name: 'description', label: 'Description', type: 'textarea' },
        ],
        onSave: async (v) => { await api('/api/events', { method: 'POST', body: v }); UI.toast('Event added'); refresh(); },
      });
    }

    async function renderAnnouncements(el) {
      try { cache.notices = await api('/api/announcements'); } catch (error) { el.innerHTML = UI.empty(error.message); return; }
      const border = { high: 'border-l-red-500', medium: 'border-l-amber-500', low: 'border-l-slate-300' };
      el.innerHTML = `<div class="space-y-6 fade">${head('Announcements', 'Notices for your department and college-wide', UI.button('+ New Announcement', 'noticeForm()'))}
        <div class="space-y-4">${cache.notices.length ? cache.notices.map((a) => `<div class="card-hover bg-white rounded-2xl border border-slate-100 border-l-4 ${border[a.priority]} p-5 shadow-sm" data-row>
          <div class="flex items-start justify-between gap-4"><div class="flex-1">
            <div class="flex items-center gap-2 mb-2 flex-wrap"><span class="text-[10px] font-bold uppercase px-2 py-0.5 bg-violet-100 text-violet-700 rounded">${esc(a.category)}</span>${UI.pill(a.priority)}<span class="text-xs text-slate-400">${fmt(a.createdAt)} • ${esc(a.createdByName || '')} • to ${esc(a.audience)}${a.department ? '' : ' (college-wide)'}</span></div>
            <h4 class="text-base font-bold text-slate-800">${esc(a.title)}</h4>${a.message ? `<p class="text-sm text-slate-600 mt-1">${esc(a.message)}</p>` : ''}</div>
            ${a.department ? UI.iconButton('trash', `deleteItem('announcements','${a._id}')`, 'Delete', 'text-red-400 hover:bg-red-50') : ''}</div></div>`).join('') : UI.empty('No announcements')}</div></div>`;
    }

    function noticeForm() {
      UI.showForm({
        title: 'New Announcement', saveLabel: 'Publish',
        fields: [
          { name: 'title', label: 'Title', required: true },
          { name: 'message', label: 'Message', type: 'textarea' },
          { name: 'category', label: 'Category', type: 'select', default: 'academic', half: true, options: ['academic', 'exam', 'event', 'research', 'infrastructure', 'general'].map((v) => ({ value: v, label: v })) },
          { name: 'priority', label: 'Priority', type: 'select', default: 'medium', half: true, options: ['high', 'medium', 'low'].map((v) => ({ value: v, label: v })) },
          { name: 'audience', label: 'Visible to', type: 'select', default: 'all', options: [['all', 'Everyone in department'], ['students', 'Students'], ['faculty', 'Faculty']].map(([value, label]) => ({ value, label })) },
        ],
        onSave: async (v) => { await api('/api/announcements', { method: 'POST', body: v }); UI.toast('Announcement published'); refresh(); },
      });
    }

    async function deleteItem(kind, id) {
      if (!confirm('Delete this item?')) return;
      try { await api(`/api/${kind}/${id}`, { method: 'DELETE' }); UI.toast('Deleted', 'info'); refresh(); } catch (error) { UI.toast(error.message, 'error'); }
    }

    // ---------- START ----------
    document.addEventListener('click', (e) => {
      const panel = document.getElementById('notifPanel');
      if (panel && !panel.classList.contains('hidden') && !e.target.closest('#notifPanel') && !e.target.closest('[onclick*="toggleNotifications"]')) panel.classList.add('hidden');
    });
    if (ERP_SESSION) {
      document.getElementById('app').innerHTML = '<div class="flex-1 flex items-center justify-center text-slate-400">Loading dashboard...</div>';
      refresh();
    }
  </script>
</body>
</html>
