      // Generic CRUD helpers
      table(name) {
        const key = 'db_' + name;
        const defaults = this.data[name];
        return {
          all() {
            try { const d = localStorage.getItem(key); if (d) return JSON.parse(d); } catch(e) {}
            localStorage.setItem(key, JSON.stringify(defaults));
            return [...defaults];
          },
          save(items) { localStorage.setItem(key, JSON.stringify(items)); return items; },
          nextId(items) { return items.length ? Math.max(...items.map(i => i.id)) + 1 : 1; },
          add(item) { const items = this.all(); item.id = this.nextId(items); this.save([...items, item]); return item; },
          update(id, changes) {
            const items = this.all(); const i = items.findIndex(x => x.id === id);
            if (i === -1) return null; items[i] = {...items[i], ...changes}; this.save(items); return items[i];
          },
          remove(id) { this.save(this.all().filter(x => x.id !== id)); },
          reset() { this.save([...defaults]); },
          approve(id) { return this.update(id, {status:'approved'}); },
          reject(id) { return this.update(id, {status:'rejected'}); },
        };
      }
    };

      let s = ''; strings.forEach((str, i) => { s += str + (vals[i] !== undefined ? vals[i] : ''); });
      return s;
    }

    function $(sel) { return document.querySelector(sel); }

    function avatar(ini, size) {
      const colors = ['bg-violet-500','bg-sky-500','bg-emerald-500','bg-amber-500','bg-pink-500','bg-indigo-500','bg-teal-500','bg-orange-500'];
      const c = colors[(ini||'A').charCodeAt(0) % colors.length];
      const sz = size === 'sm' ? 'h-8 w-8 text-xs' : size === 'lg' ? 'h-14 w-14 text-lg' : 'h-10 w-10 text-sm';
      return `<div class="${sz} ${c} rounded-xl flex items-center justify-center font-semibold text-white shadow-sm flex-shrink-0">${ini}</div>`;
    }

    function badge(s, cls) { return `<span class="text-xs font-medium px-2 py-0.5 rounded-lg ${cls}">${s}</span>`; }

    function status(s) {
      const m = { active:'bg-emerald-50 text-emerald-700', on_leave:'bg-amber-50 text-amber-700', sabbatical:'bg-sky-50 text-sky-700',
        suspended:'bg-red-50 text-red-700', graduated:'bg-sky-50 text-sky-700', approved:'bg-emerald-50 text-emerald-700',
        rejected:'bg-red-50 text-red-700', pending:'bg-amber-50 text-amber-700', completed:'bg-sky-50 text-sky-700' };
      return `<span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium ${m[s] || 'bg-slate-100 text-slate-600'} capitalize">${(s||'').replace(/_/g,' ')}</span>`;
    }

    function priority(p) {
      const m = { high:'bg-red-50 text-red-700 border-red-200', medium:'bg-amber-50 text-amber-700 border-amber-200', low:'bg-slate-50 text-slate-600 border-slate-200' };
      return `<span class="text-xs font-medium px-2 py-0.5 rounded-lg border ${m[p]||m.low}">${p.charAt(0).toUpperCase()+p.slice(1)}</span>`;
    }

    function progress(val, max, w) {
      w = w || 'w-20';
      const pct = Math.round((val/(max||1))*100);
      const color = pct >= 90 ? 'bg-emerald-500' : pct >= 75 ? 'bg-sky-500' : pct >= 60 ? 'bg-amber-500' : 'bg-red-500';
      return `<div class="flex items-center gap-2"><div class="${w} h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${color} rounded-full" style="width:${pct}%"></div></div><span class="text-xs text-slate-500">${pct}%</span></div>`;
    }

    function trend(t) {
      if (t === 'up') return '<span class="text-emerald-500 text-xs font-medium">▲</span>';
      if (t === 'down') return '<span class="text-red-500 text-xs font-medium">▼</span>';
      return '<span class="text-slate-400 text-xs font-medium">◆</span>';
    }

    function statCard(label, value, change, up, icon, grad) {

          <span class="text-xs font-medium ${up ? 'text-emerald-600 bg-emerald-50' : 'text-red-600 bg-red-50'} px-2 py-0.5 rounded-lg">${change}</span>
        </div>

        <p class="mt-0.5 text-xs lg:text-sm text-slate-500">${label}</p>
      </div>`;
    }

    function openModal(html) {
      closeModal();

      div.innerHTML = `<div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto fade" onclick="event.stopPropagation()">${html}</div>`;
      document.getElementById('mainContent').appendChild(div);
    }

    function closeModal() { const m = document.querySelector('.fixed.inset-0.z-50'); if (m) m.remove(); }

    function formInput(label, val, name, type, opts) {
      type = type || 'text'; opts = opts || {};
      const id = 'f_'+name;
      let field = '';
      if (type === 'select') {
        field = `<select class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-200" id="${id}">${(opts||[]).map(o => `<option value="${o.value}" ${val==o.value?'selected':''}>${o.label}</option>`).join('')}</select>`;
      } else if (type === 'number') {
        field = `<input type="number" step="${opts.step||'1'}" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-200" id="${id}" value="${val||''}" ${opts.min!==undefined?'min="'+opts.min+'"':''} ${opts.max!==undefined?'max="'+opts.max+'"':''}>`;
      } else if (type === 'textarea') {
        field = `<textarea class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-200" id="${id}" rows="${opts.rows||2}">${val||''}</textarea>`;
      } else {
        field = `<input type="${type}" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-200" id="${id}" value="${val||''}">`;
      }
      return `<div class="space-y-1"><label class="block text-xs font-medium text-slate-500" for="${id}">${label}</label>${field}</div>`;
    }

    function showForm(title, fields, onSave) {
      openModal(`<h2 class="text-lg font-bold text-slate-800 mb-4">${title}</h2><div class="space-y-4">${fields}</div>

        <div class="flex items-center justify-between">
          <div><h3 class="text-xl font-bold">Research</h3><p class="text-sm text-slate-500">${items.length} projects • $${items.reduce((s,p)=>s+p.funding,0).toFixed(1)}M total</p></div>
          <button onclick="resForm()" class="px-4 py-2 bg-violet-600 text-white text-sm font-medium rounded-xl hover:bg-violet-700 shadow-sm">+ New</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${items.map(p => `<div class="bg-white rounded-2xl border border-slate-200 p-5 hover:shadow-md"><div class="flex items-start justify-between mb-3">${status(p.status)}<div class="flex gap-1"><button onclick="resEdit(${p.id})" class="p-1 rounded-lg text-slate-400 hover:text-sky-500 hover:bg-sky-50"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button><button onclick="if(confirm('Delete?')){db.research.remove(${p.id});render()}" class="p-1 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div></div><h3 class="font-semibold text-slate-800 mb-1">${p.title}</h3><p class="text-xs text-slate-400 mb-3">${p.dept} • Lead: ${p.lead}</p><div class="flex justify-between text-sm"><span class="font-bold text-violet-600">$${p.funding.toFixed(1)}M</span><span class="text-xs text-slate-400">${p.start} → ${p.end}</span></div></div>`).join('')}</div>
      </div>`;
    }

    function resForm(data) {
      data = data || {title:'',lead:'',dept:'',funding:0,status:'active',start:'',end:''};
      showForm(data.id?'Edit':'New Project',
        formInput('Title',data.title,'title')+formInput('Lead',data.lead,'lead')+formInput('Dept',data.dept,'dept')+formInput('Funding $M',data.funding,'funding','number',{step:'0.1'})+formInput('Status',data.status,'status','select',[{value:'active',label:'Active'},{value:'completed',label:'Completed'},{value:'pending',label:'Pending'}])+formInput('Start',data.start,'start')+formInput('End',data.end,'end'),
        () => { const v = getForm(); if(data.id) db.research.update(data.id,v); else db.research.add(v); closeModal(); render(); }
      );
    }

    function resEdit(id) { const r = db.research.all().find(x => x.id === id); if(r) resForm(r); }

    // ─── REPORTS ───────────────────────────────────────────────────────────

    let generating = false;

    function renderReports(el) {
      const items = db.reports.all();
      el.innerHTML = `<div class="space-y-6 fade">
        <div class="flex items-center justify-between">
          <div><h3 class="text-xl font-bold">Reports</h3><p class="text-sm text-slate-500">${items.length} reports</p></div>
          <button onclick="genReport()" id="genBtn" class="px-4 py-2 bg-slate-900 text-white text-sm font-medium rounded-xl hover:bg-slate-800 shadow-sm">+ Generate</button>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
          <table class="w-full"><thead><tr class="text-xs text-slate-400 uppercase tracking-wider bg-slate-50/50"><th class="text-left px-5 py-3">Title</th><th class="text-left px-5 py-3">Type</th><th class="text-left px-5 py-3">By</th><th class="text-left px-5 py-3">Date</th><th class="text-left px-5 py-3">Format</th><th class="text-right px-5 py-3">Actions</th></tr></thead>
          <tbody class="divide-y divide-slate-50">${items.map(r => `<tr class="hover:bg-slate-50/50"><td class="px-5 py-3.5 text-sm font-medium">${r.title}</td><td class="px-5 py-3.5"><span class="text-xs font-medium text-slate-600 bg-slate-50 px-2 py-0.5 rounded-lg">${r.type}</span></td><td class="px-5 py-3.5 text-sm">${r.by}</td><td class="px-5 py-3.5 text-sm">${r.date}</td><td class="px-5 py-3.5"><span class="px-2 py-0.5 rounded-md text-xs font-bold uppercase ${r.format==='pdf'?'text-red-500 bg-red-50':r.format==='excel'?'text-emerald-500 bg-emerald-50':'text-sky-500 bg-sky-50'}">${r.format}</span></td><td class="px-5 py-3.5 text-right"><div class="flex justify-end gap-1"><button class="p-1.5 rounded-lg text-violet-500 hover:bg-violet-50"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg></button><button onclick="if(confirm('Delete?')){db.reports.remove(${r.id});render()}" class="p-1.5 rounded-lg text-red-400 hover:bg-red-50"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div></td></tr>`).join('')}</tbody></table>
        </div>
      </div>`;
    }

    function genReport() {
      if (generating) return; generating = true;
      const btn = document.getElementById('genBtn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<svg class="h-4 w-4 spin inline" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Generating...'; }
      setTimeout(() => { 
        const t = ['Annual','Financial','Admissions','Academic','HR'];
        const f = ['pdf','excel','csv'];
        db.reports.add({ title: t[Math.floor(Math.random()*t.length)] + ' Report', type: t[Math.floor(Math.random()*t.length)], by: 'Prof. Williams', date: new Date().toISOString().split('T')[0], format: f[Math.floor(Math.random()*f.length)] });
        generating = false; render();
      }, 1200);
    }

    // ─── SETTINGS ──────────────────────────────────────────────────────────

    function renderSettings(el) {
      el.innerHTML = `<div class="space-y-8 max-w-3xl fade">
        <div><h3 class="text-xl font-bold">Settings</h3><p class="text-sm text-slate-500">Dashboard preferences</p></div>
        <div class="bg-white rounded-2xl border border-slate-200 p-6">
          <h3 class="text-lg font-semibold mb-4">Database Connection</h3>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="p-4 bg-slate-50 rounded-xl"><p class="text-xs text-slate-400 mb-1">Status</p><div class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span><span class="text-sm font-semibold text-emerald-600">Connected</span></div></div>
            <div class="p-4 bg-slate-50 rounded-xl"><p class="text-xs text-slate-400 mb-1">Engine</p><p class="text-sm font-semibold">LocalStorage</p></div>
            <div class="p-4 bg-slate-50 rounded-xl"><p class="text-xs text-slate-400 mb-1">Latency</p><p class="text-sm font-semibold">&lt; 2ms</p></div>
          </div>
          <p class="text-xs mt-4 bg-amber-50 text-amber-700 p-3 rounded-xl"><strong>Note:</strong> Data in localStorage. Replace DB calls with real API endpoints for production.</p>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-6">
          <h3 class="text-lg font-semibold mb-4">Notifications</h3>
          ${['Email','Push','Approvals','Reports','Events'].map(n => `<div class="flex items-center justify-between py-2"><div><p class="text-sm font-medium">${n}</p><p class="text-xs text-slate-400">Manage ${n.toLowerCase()} alerts</p></div><label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" class="sr-only peer" checked><div class="w-11 h-6 bg-slate-300 peer-checked:bg-violet-600 rounded-full transition-colors"></div><span class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform peer-checked:translate-x-5"></span></label></div>`).join('')}
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-6">
          <h3 class="text-lg font-semibold mb-4">Account</h3>
          <div class="space-y-4">
            <div><label class="block text-xs font-medium text-slate-500 mb-1">Name</label><input class="w-full sm:w-80 border border-slate-200 rounded-xl px-3 py-2 text-sm" value="Prof. Williams"></div>
            <div><label class="block text-xs font-medium text-slate-500 mb-1">Email</label><input class="w-full sm:w-80 border border-slate-200 rounded-xl px-3 py-2 text-sm" value="p.williams@crestview.edu"></div>
            <div><label class="block text-xs font-medium text-slate-500 mb-1">Role</label><input class="w-full sm:w-80 border border-slate-200 rounded-xl px-3 py-2 text-sm bg-slate-50 text-slate-500" value="Principal" disabled></div>
          </div>
        </div>
        <div class="flex flex-col sm:flex-row gap-4">
          <button onclick="alert('Saved!')" class="px-6 py-2.5 bg-violet-600 text-white text-sm font-medium rounded-xl hover:bg-violet-700 shadow-sm">Save</button>
          <button onclick="if(confirm('Reset ALL data?')){db.resetAll();render()}" class="px-6 py-2.5 bg-red-50 text-red-600 text-sm font-medium rounded-xl hover:bg-red-100 border border-red-200">Reset All Data</button>
        </div>
      </div>`;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // 7. START
    // ═══════════════════════════════════════════════════════════════════════════

    render();
  </script>
</body>
</html>
