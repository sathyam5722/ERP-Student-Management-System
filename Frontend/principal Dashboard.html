<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Principal Dashboard | AMC Engineering College</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .slide { transition: transform 0.3s ease; }
    .fade { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .pop { animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .brand-grad { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%); }
    .brand-grad-soft { background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 100%); }
    .glass { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.85); }
    .nav-item { position: relative; transition: all 0.2s ease; }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 24px; background: linear-gradient(180deg, #6366f1, #8b5cf6); border-radius: 0 4px 4px 0; }
    .stat-icon { transition: transform 0.3s ease; }
    .stat-card:hover .stat-icon { transform: scale(1.1) rotate(-5deg); }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.15); }
    .ring-glow { box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12); }
    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .gradient-text { background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .table-row { transition: background 0.15s; }
    .table-row:hover { background: linear-gradient(90deg, #eef2ff 0%, transparent 100%); }
  </style>
</head>
<body>
  <div id="app" class="flex h-screen overflow-hidden"></div>

  <script src="auth.js"></script>
  <script src="leader-ui.js"></script>
  <script>
    // ═══════════════════════════════════════════════════════════════════════
    // PRINCIPAL DASHBOARD — college-wide view, all data from the backend
    // ═══════════════════════════════════════════════════════════════════════
    const ERP_SESSION = ErpAuth.requireRole(['principal']);
    const UI = LeaderUI;
    const { esc, fmt } = UI;
    const api = ErpAuth.api;
    const money = ErpAuth.rupees;

    let me = ERP_SESSION || {};
    let page = 'dashboard';
    let sidebarOpen = false;
    let ov = null;
    let notifications = [];
    let cache = {};
    let filters = { facultyDept: '', studentDept: '', studentSem: '', admission: 'pending', leave: 'pending', hod: 'active' };

    const NAV = [
      { id: 'dashboard', label: 'Dashboard', icon: 'home' },
      { id: 'departments', label: 'Departments', icon: 'building' },
      { id: 'hod', label: 'HODs', icon: 'user' },
      { id: 'faculty', label: 'Faculty', icon: 'users' },
      { id: 'students', label: 'Students', icon: 'book' },
      { id: 'admissions', label: 'Admissions', icon: 'userAdd' },
      { id: 'approvals', label: 'Leave Approvals', icon: 'doc' },
      { id: 'research', label: 'Research', icon: 'bulb' },
      { id: 'events', label: 'Events & Notices', icon: 'calendar' },
      { id: 'reports', label: 'Reports & Finance', icon: 'chart' },
      { id: 'settings', label: 'Settings', icon: 'cog' },
    ];
    const TITLES = {
      dashboard: ['Dashboard', 'College-wide overview'], departments: ['Departments', 'Performance by department'], hod: ['Heads of Department', 'Manage HOD accounts'],
      faculty: ['Faculty', 'All faculty members'], students: ['Students', 'All enrolled students'], admissions: ['Admissions', 'Review applications'],
      approvals: ['Leave Approvals', 'Leave requests from HODs and staff'], research: ['Research', 'Projects and funding'], events: ['Events & Notices', 'College calendar and announcements'],
      reports: ['Reports & Finance', 'Fee collection and downloadable reports'], settings: ['Settings', 'Profile & password'],
    };

    async function refresh() {
      try {
        const [o, n, profile] = await Promise.all([api('/api/principal-portal/overview'), api('/api/notifications'), api('/api/auth/me')]);
        ov = o; notifications = n; me = profile.user;
        render();
      } catch (error) { UI.toast(error.message, 'error'); }
    }
    function go(p) { page = p; sidebarOpen = false; render(); }
    function toggleSidebar() { sidebarOpen = !sidebarOpen; render(); }
    function logout() { if (confirm('Are you sure you want to logout?')) ErpAuth.logout(); }
    window.onProfileSaved = (user) => { me = user; render(); };

    function render() {
      if (!ERP_SESSION || !ov) return;
      NAV.find((n) => n.id === 'admissions').badge = ov.admissions.pending;
      NAV.find((n) => n.id === 'approvals').badge = ov.pendingLeaves.length;
      const [title, subtitle] = TITLES[page];
      UI.shell({
        brand: 'AMC Engineering', subtitle: 'Principal Dashboard', infoTitle: 'Institution', infoValue: 'AMC Engineering College',
        infoMeta: `${ov.totals.departments} departments • ${ov.totals.students} students`, nav: NAV, page, user: me, roleLabel: 'Principal',
        notifications, sidebarOpen, title, subtitleText: subtitle,
        notificationPage: (n) => ({ leaves: 'approvals', admissions: 'admissions', students: 'students', notices: 'events' }[n.section] || 'dashboard'),
      });
      const el = document.getElementById('mainContent');
      ({ dashboard: renderDashboard, departments: renderDepartments, hod: renderHods, faculty: renderFaculty, students: renderStudents, admissions: renderAdmissions,
         approvals: renderApprovals, research: renderResearch, events: renderEvents, reports: renderReports, settings: (e) => { e.innerHTML = UI.settingsPage(me, 'Principal'); } }[page])(el);
    }

    const head = (title, sub, action) => `<div class="flex items-center justify-between flex-wrap gap-4"><div><h3 class="text-2xl font-extrabold text-slate-800">${title}</h3><p class="text-sm text-slate-500 mt-1">${sub}</p></div>${action || ''}</div>`;
    const table = (headers, rows, emptyText) => `<div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-x-auto"><table class="w-full">
        <thead><tr class="text-[10px] uppercase tracking-wider text-slate-400 bg-slate-50/50">${headers.map((h) => `<th class="text-left px-6 py-3.5 font-bold">${h}</th>`).join('')}</tr></thead>
        <tbody class="divide-y divide-slate-50">${rows.length ? rows.join('') : `<tr><td colspan="${headers.length}">${UI.empty(emptyText || 'Nothing here')}</td></tr>`}</tbody></table></div>`;
    const td = (v, cls) => `<td class="px-6 py-3.5 text-sm ${cls || 'text-slate-600'}">${v}</td>`;
    const deptOptions = () => [{ value: '', label: 'Select department' }, ...ov.departments.map((d) => ({ value: d.name, label: d.name }))];

    // ---------- DASHBOARD ----------
    function renderDashboard(el) {
      const hour = new Date().getHours();
      el.innerHTML = `<div class="space-y-7 fade">
        <div class="brand-grad rounded-3xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden">
          <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/4"></div>
          <div class="relative z-10">
            <p class="text-violet-100 text-sm">${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
            <h2 class="text-2xl sm:text-3xl font-extrabold mt-1">Good ${hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening'}, ${esc(me.name)} 👋</h2>
            <p class="text-violet-100 mt-2">${ov.admissions.pending} admission application(s) and ${ov.pendingLeaves.length} leave request(s) are waiting for you.</p>
            <div class="flex flex-wrap gap-3 mt-5">
              <button onclick="go('admissions')" class="px-4 py-2 bg-white text-violet-700 text-sm font-bold rounded-xl shadow">Review Admissions</button>
              <button onclick="go('approvals')" class="px-4 py-2 bg-white/20 text-white text-sm font-semibold rounded-xl border border-white/30">Leave Approvals</button>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          ${UI.statCard({ label: 'Total Students', value: ov.totals.students, iconName: 'book', gradient: 'from-sky-500 to-blue-600', go: 'students' })}
          ${UI.statCard({ label: 'Faculty Members', value: ov.totals.faculty, sub: `${ov.totals.hods} HODs`, iconName: 'users', gradient: 'from-violet-500 to-purple-600', go: 'faculty' })}
          ${UI.statCard({ label: 'Departments', value: ov.totals.departments, iconName: 'building', gradient: 'from-emerald-500 to-teal-600', go: 'departments' })}
          ${UI.statCard({ label: 'Fees Collected', value: money(ov.fees.collected), sub: `${ov.fees.percentCollected}%`, iconName: 'money', gradient: 'from-amber-500 to-orange-600', go: 'reports' })}
        </div>
        ${UI.panel('Department Performance', departmentTable(), UI.link('Details', 'departments'))}
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2">${UI.panel('Pending Approvals', approvalsList(5), UI.link('View All', 'approvals'))}</div>
          ${UI.panel('Upcoming Events', ov.upcomingEvents.length ? `<div class="p-4 space-y-3">${ov.upcomingEvents.map((e) => `<div class="flex items-center gap-3 p-3 rounded-2xl hover:bg-slate-50 cursor-pointer" onclick="go('events')">
              <div class="text-center min-w-[44px]"><p class="text-[10px] font-bold text-violet-600 uppercase">${new Date(e.date).toLocaleString('en-US', { month: 'short' })}</p><p class="text-xl font-extrabold text-slate-800 leading-none">${new Date(e.date).getDate()}</p></div>
              <div class="flex-1 min-w-0 border-l-2 border-slate-100 pl-3"><p class="text-sm font-bold text-slate-800 truncate">${esc(e.title)}</p><p class="text-xs text-slate-400">${esc([e.time, e.location].filter(Boolean).join(' • '))}</p></div></div>`).join('')}</div>` : UI.empty('No upcoming events'), UI.link('Calendar', 'events'))}
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          ${UI.panel('Admissions by Year', UI.bars(ov.admissions.byYear.map((y) => ({ label: `${y.year} (${y.approved} approved)`, value: y.applications }))), UI.link('Admissions', 'admissions'))}
          ${UI.panel('Fee Collection (last 6 months)', UI.bars(ov.fees.monthly.map((m) => ({ label: m.label, value: Math.round(m.collected / 1000) })), 'k'), UI.link('Finance', 'reports'))}
        </div>
      </div>`;
    }

    function departmentTable() {
      return `<div class="overflow-x-auto"><table class="w-full"><thead><tr class="text-[10px] uppercase tracking-wider text-slate-400 bg-slate-50/50">
        ${['Department', 'HOD', 'Students', 'Faculty', 'Attendance', 'Avg Marks'].map((h) => `<th class="text-left px-6 py-3 font-bold">${h}</th>`).join('')}</tr></thead>
        <tbody class="divide-y divide-slate-50">${ov.departments.length ? ov.departments.map((d) => `<tr class="table-row" data-row>
          ${td(`<span class="font-bold text-slate-800">${esc(d.name)}</span>`)}${td(esc(d.hod || '— not assigned —'))}${td(d.students)}${td(d.faculty)}${td(UI.progress(d.avgAttendance))}${td(UI.progress(d.avgMarks))}</tr>`).join('') : `<tr><td colspan="6">${UI.empty('No departments yet')}</td></tr>`}</tbody></table></div>`;
    }

    function approvalsList(limit) {
      const leaves = ov.pendingLeaves.slice(0, limit).map((l) => `<div class="px-6 py-4 flex items-center gap-4" data-row>${UI.avatar(l.applicantName)}
          <div class="flex-1 min-w-0"><p class="text-sm font-bold text-slate-800">${esc(l.applicantName)} <span class="text-[10px] font-bold uppercase px-2 py-0.5 bg-violet-50 text-violet-700 rounded">${esc(l.type)} leave</span></p>
          <p class="text-xs text-slate-500">${esc(l.applicantTitle || l.applicantKind)}${l.department ? ` • ${esc(l.department)}` : ''} • ${fmt(l.from)} → ${fmt(l.to)} (${l.days}d)</p><p class="text-xs text-slate-400 italic">"${esc(l.reason)}"</p></div>
          <div class="flex gap-2">${UI.button('Approve', `reviewLeave('${l._id}','approved')`, 'ok')}${UI.button('Reject', `reviewLeave('${l._id}','rejected')`, 'no')}</div></div>`);
      const apps = ov.admissions.recentPending.slice(0, limit).map((a) => `<div class="px-6 py-4 flex items-center gap-4" data-row>${UI.avatar(a.name)}
          <div class="flex-1 min-w-0"><p class="text-sm font-bold text-slate-800">${esc(a.name)} <span class="text-[10px] font-bold uppercase px-2 py-0.5 bg-sky-50 text-sky-700 rounded">admission</span></p>
          <p class="text-xs text-slate-500">${esc(a.program || a.department || '')}${a.score !== undefined && a.score !== null ? ` • score ${a.score}%` : ''} • applied ${fmt(a.createdAt)}</p></div>
          <div class="flex gap-2">${UI.button('Approve', `reviewAdmission('${a._id}','approved')`, 'ok')}${UI.button('Reject', `reviewAdmission('${a._id}','rejected')`, 'no')}</div></div>`);
      const all = [...leaves, ...apps];
      return all.length ? `<div class="divide-y divide-slate-50">${all.join('')}</div>` : UI.empty('Nothing waiting for approval');
    }

    async function reviewLeave(id, status) {
      const note = status === 'rejected' ? prompt('Reason for rejecting (optional):', '') : '';
      if (note === null) return;
      try { await api(`/api/leaves/${id}/review`, { method: 'PATCH', body: { status, note } }); UI.toast(`Leave ${status}`); cache.leaves = null; refresh(); } catch (error) { UI.toast(error.message, 'error'); }
    }

    async function reviewAdmission(id, status) {
      let password = '';
      if (status === 'approved') {
        password = prompt('Approve and enroll this applicant.\n\nSet a password for the new student account (at least 6 characters):', '');
        if (password === null) return;
      } else if (!confirm('Reject this application?')) return;
      try { const res = await api(`/api/admissions/${id}/review`, { method: 'PATCH', body: { status, password } }); UI.toast(res.message); cache.admissions = null; refresh(); } catch (error) { UI.toast(error.message, 'error'); }
    }

    // ---------- DEPARTMENTS ----------
    function renderDepartments(el) {
      el.innerHTML = `<div class="space-y-6 fade">${head('Departments', `${ov.departments.length} departments`, UI.button('+ Add Department', 'deptForm()'))}
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">${ov.departments.map((d) => `<div class="card-hover bg-white rounded-3xl border border-slate-100 p-6 shadow-sm" data-row>
          <div class="flex items-start justify-between"><div><p class="text-xs font-mono font-bold text-slate-400">${esc(d.departmentId || '')} • ${esc(d.collegeType || '')}</p><h4 class="text-lg font-extrabold text-slate-800 mt-1">${esc(d.name)}</h4></div>
            <div class="flex gap-1">${UI.iconButton('edit', `deptForm('${d._id}')`, 'Edit')}</div></div>
          <p class="text-sm text-slate-500 mt-2">HOD: <span class="font-semibold text-slate-700">${esc(d.hod || 'Not assigned')}</span></p>
          <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-100">
            <button class="text-left" onclick="filters.studentDept='${esc(d.name)}'; go('students')"><p class="text-[10px] uppercase font-bold text-slate-400">Students</p><p class="text-xl font-extrabold text-slate-800">${d.students}</p></button>
            <button class="text-left" onclick="filters.facultyDept='${esc(d.name)}'; go('faculty')"><p class="text-[10px] uppercase font-bold text-slate-400">Faculty</p><p class="text-xl font-extrabold text-slate-800">${d.faculty}</p></button>
            <div><p class="text-[10px] uppercase font-bold text-slate-400 mb-1">Attendance</p>${UI.progress(d.avgAttendance)}</div>
            <div><p class="text-[10px] uppercase font-bold text-slate-400 mb-1">Avg Marks</p>${UI.progress(d.avgMarks)}</div>
          </div>
          <div class="mt-4">${UI.pill(d.status || 'active')}</div>
        </div>`).join('') || UI.empty('No departments yet')}</div></div>`;
    }

    function deptForm(id) {
      const d = id ? ov.departments.find((x) => x._id === id) : null;
      UI.showForm({
        title: d ? 'Edit Department' : 'Add Department', values: d || { status: 'active', collegeType: 'AMCEC' },
        fields: [
          { name: 'name', label: 'Department Name', required: true },
          { name: 'departmentId', label: 'Department Code', half: true },
          { name: 'collegeType', label: 'College', type: 'select', half: true, options: ['AMCEC', 'AMCDC'].map((v) => ({ value: v, label: v })) },
          { name: 'status', label: 'Status', type: 'select', half: true, options: ['active', 'inactive'].map((v) => ({ value: v, label: v })) },
        ],
        onSave: async (v) => { await api(d ? `/api/departments/${d._id}` : '/api/departments', { method: d ? 'PUT' : 'POST', body: v }); UI.toast(d ? 'Department updated' : 'Department added'); refresh(); },
      });
    }

    // ---------- HODs ----------
    async function renderHods(el) {
      try { cache.hods = await api(`/api/hod/${filters.hod}`); } catch (error) { el.innerHTML = UI.empty(error.message); return; }
      const tab = (s, l) => `<button onclick="filters.hod='${s}'; render()" class="px-4 py-2 text-sm font-semibold rounded-xl ${filters.hod === s ? 'bg-violet-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}">${l}</button>`;
      el.innerHTML = `<div class="space-y-6 fade">${head('Heads of Department', 'HODs log in from the login page as "HOD"', `<div class="flex gap-2">${tab('active', 'Active')}${tab('inactive', 'Inactive')}${UI.button('+ Add HOD', 'hodForm()')}</div>`)}
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">${cache.hods.length ? cache.hods.map((h) => `<div class="card-hover bg-white rounded-3xl border border-slate-100 p-6 shadow-sm" data-row>
          <div class="flex items-start justify-between mb-4"><div class="flex items-center gap-3">${UI.avatar(h.name, 'lg')}<div><p class="font-bold text-slate-800">${esc(h.name)}</p><p class="text-xs text-slate-500">${esc(h.department || 'No department')}</p></div></div>
            <div class="flex gap-1">${UI.iconButton('edit', `hodForm('${h._id}')`, 'Edit')}
            ${filters.hod === 'active' ? UI.iconButton('trash', `setHodActive('${h._id}', false)`, 'Deactivate', 'text-red-400 hover:bg-red-50') : UI.iconButton('check', `setHodActive('${h._id}', true)`, 'Reactivate', 'text-emerald-500 hover:bg-emerald-50')}</div></div>
          <div class="space-y-1.5 text-xs text-slate-600"><p>✉ ${esc(h.email)}</p><p>☎ ${esc(h.phone || '—')}</p><p>🆔 ${esc(h.hodId || '—')} • since ${fmt(h.appointedDate)}</p></div>
        </div>`).join('') : `<div class="col-span-3">${UI.empty('No HODs here')}</div>`}</div></div>`;
    }

    function hodForm(id) {
      const h = id ? cache.hods.find((x) => x._id === id) : null;
      UI.showForm({
        title: h ? 'Edit HOD' : 'Add HOD', values: h || { collegeType: 'AMCEC' },
        fields: [
          { name: 'name', label: 'Full Name', required: true },
          { name: 'email', label: 'Email (login)', type: 'email', required: true, half: true },
          { name: 'hodId', label: 'HOD ID', half: true },
          { name: 'department', label: 'Department', type: 'select', required: true, options: deptOptions() },
          { name: 'phone', label: 'Phone', half: true },
          { name: 'appointedDate', label: 'Appointed On', type: 'date', half: true },
          { name: 'collegeType', label: 'College', type: 'select', half: true, options: ['AMCEC', 'AMCDC'].map((v) => ({ value: v, label: v })) },
          { name: 'password', label: h ? 'New Password (leave blank to keep)' : 'Password (min 6 characters)', type: 'password', required: !h, half: true },
        ],
        onSave: async (v) => {
          if (!v.password) delete v.password;
          await api(h ? `/api/hod/${h._id}` : '/api/hod', { method: h ? 'PATCH' : 'POST', body: v });
          UI.toast(h ? 'HOD updated' : 'HOD added');
          refresh();
        },
      });
    }

    async function setHodActive(id, active) {
      if (!confirm(active ? 'Reactivate this HOD?' : 'Deactivate this HOD? They will not be able to log in.')) return;
      try { await api(`/api/hod/${active ? 'reactivate' : 'inactive'}/${id}`, { method: 'PATCH' }); UI.toast(active ? 'HOD reactivated' : 'HOD deactivated'); refresh(); } catch (error) { UI.toast(error.message, 'error'); }
    }

    // ---------- FACULTY & STUDENTS (read-only, college-wide) ----------
    const deptSelect = (key) => `<select onchange="filters.${key}=this.value; render()" class="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white">
        <option value="">All departments</option>${ov.departments.map((d) => `<option ${filters[key] === d.name ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select>`;
    const sameDept = (a, b) => String(a || '').toLowerCase() === String(b || '').toLowerCase();

    async function renderFaculty(el) {
      try { cache.faculty = cache.faculty || await api('/api/faculty/active'); } catch (error) { el.innerHTML = UI.empty(error.message); return; }
      const list = cache.faculty.filter((f) => !filters.facultyDept || sameDept(f.department, filters.facultyDept));
      el.innerHTML = `<div class="space-y-6 fade">${head('Faculty', `${list.length} active faculty`, deptSelect('facultyDept'))}
        ${table(['Name', 'Department', 'Designation', 'Email', 'Phone'], list.map((f) => `<tr class="table-row" data-row>${td(`<div class="flex items-center gap-3">${UI.avatar(f.name, 'sm')}<span class="font-bold text-slate-800">${esc(f.name)}</span></div>`)}${td(esc(f.department || '—'))}${td(esc(f.designation || '—'))}${td(esc(f.email))}${td(esc(f.phone || '—'))}</tr>`), 'No faculty')}</div>`;
    }

    async function renderStudents(el) {
      try { cache.students = cache.students || await api('/api/students'); } catch (error) { el.innerHTML = UI.empty(error.message); return; }
      const list = cache.students.filter((s) => (!filters.studentDept || sameDept(s.department, filters.studentDept)) && (!filters.studentSem || String(s.semester) === filters.studentSem));
      el.innerHTML = `<div class="space-y-6 fade">${head('Students', `${list.length} students`, `<div class="flex gap-2">${deptSelect('studentDept')}
          <select onchange="filters.studentSem=this.value; render()" class="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white"><option value="">All semesters</option>${[1, 2, 3, 4, 5, 6, 7, 8].map((n) => `<option ${filters.studentSem === String(n) ? 'selected' : ''}>${n}</option>`).join('')}</select></div>`)}
        ${table(['Student', 'ID', 'Department', 'Course', 'Sem / Sec', 'Status'], list.map((s) => `<tr class="table-row" data-row>${td(`<div class="flex items-center gap-3">${UI.avatar(s.name, 'sm')}<div><p class="font-bold text-slate-800">${esc(s.name)}</p><p class="text-xs text-slate-400">${esc(s.email)}</p></div></div>`)}
          ${td(esc(s.studentId || '—'), 'font-mono text-slate-600')}${td(esc(s.department || '—'))}${td(esc(s.courseName || '—'))}${td(s.semester ? `${s.semester}${s.section ? ' / ' + esc(s.section) : ''}` : '—')}${td(UI.pill(s.status || 'active'))}</tr>`), 'No students')}</div>`;
    }

    // ---------- ADMISSIONS ----------
    async function renderAdmissions(el) {
      try { cache.admissions = await api(`/api/admissions${filters.admission ? `?status=${filters.admission}` : ''}`); } catch (error) { el.innerHTML = UI.empty(error.message); return; }
      const tab = (s, l) => `<button onclick="filters.admission='${s}'; render()" class="px-4 py-2 text-sm font-semibold rounded-xl ${filters.admission === s ? 'bg-violet-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}">${l}</button>`;
      el.innerHTML = `<div class="space-y-6 fade">
        ${head('Admissions', `Approving enrolls the applicant as a semester-1 student with a password you set. Public form: <a class="text-violet-600 font-semibold" href="apply.html" target="_blank">apply.html</a>`, `<div class="flex gap-2 flex-wrap">${tab('pending', `Pending (${ov.admissions.pending})`)}${tab('approved', 'Approved')}${tab('rejected', 'Rejected')}${tab('', 'All')}${UI.button('+ Add Application', 'admissionForm()')}</div>`)}
        ${table(['Applied', 'Applicant', 'Department / Program', 'Score', 'Status', ''], cache.admissions.map((a) => `<tr class="table-row" data-row>${td(fmt(a.createdAt))}
          ${td(`<p class="font-bold text-slate-800">${esc(a.name)}</p><p class="text-xs text-slate-400">${esc(a.email)}${a.phone ? ' • ' + esc(a.phone) : ''}</p>`)}${td(`${esc(a.department || '—')}<br><span class="text-xs text-slate-400">${esc(a.program || '')}</span>`)}
          ${td(a.score ?? '—')}${td(UI.pill(a.status))}
          ${td(a.status === 'pending' ? `<div class="flex gap-2 justify-end">${UI.button('Approve', `reviewAdmission('${a._id}','approved')`, 'ok')}${UI.button('Reject', `reviewAdmission('${a._id}','rejected')`, 'no')}</div>` : `<span class="text-xs text-slate-400">${esc(a.reviewedByName || '')}</span>`)}</tr>`), 'No applications')}
      </div>`;
    }

    function admissionForm() {
      UI.showForm({
        title: 'Add Admission Application',
        fields: [
          { name: 'name', label: 'Applicant Name', required: true },
          { name: 'email', label: 'Email', type: 'email', required: true, half: true },
          { name: 'phone', label: 'Phone', half: true },
          { name: 'department', label: 'Department', type: 'select', options: deptOptions() },
          { name: 'program', label: 'Program', placeholder: 'e.g. B.E. Computer Science', half: true },
          { name: 'score', label: 'Score (%)', type: 'number', min: 0, max: 100, half: true },
        ],
        onSave: async (v) => { await api('/api/admissions', { method: 'POST', body: v }); UI.toast('Application added'); refresh(); },
      });
    }

    // ---------- LEAVE APPROVALS ----------
    async function renderApprovals(el) {
      try { cache.leaves = await api(`/api/leaves${filters.leave ? `?status=${filters.leave}` : ''}`); } catch (error) { el.innerHTML = UI.empty(error.message); return; }
      const tab = (s, l) => `<button onclick="filters.leave='${s}'; render()" class="px-4 py-2 text-sm font-semibold rounded-xl ${filters.leave === s ? 'bg-violet-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}">${l}</button>`;
      el.innerHTML = `<div class="space-y-6 fade">${head('Leave Approvals', 'Requests from HODs and staff (faculty leave is approved by their HOD)', `<div class="flex gap-2">${tab('pending', 'Pending')}${tab('approved', 'Approved')}${tab('rejected', 'Rejected')}${tab('', 'All')}</div>`)}
        ${table(['Applicant', 'Type', 'Dates', 'Reason', 'Status', ''], cache.leaves.map((l) => `<tr class="table-row" data-row>
          ${td(`<p class="font-bold text-slate-800">${esc(l.applicantName)}</p><p class="text-xs text-slate-400">${esc(l.applicantTitle || l.applicantKind)}${l.department ? ' • ' + esc(l.department) : ''}</p>`)}
          ${td(esc(l.type))}${td(`${fmt(l.from)} → ${fmt(l.to)}<br><span class="text-xs text-slate-400">${l.days} day(s)</span>`)}${td(`<span class="italic">${esc(l.reason)}</span>`)}
          ${td(`${UI.pill(l.status)}${l.reviewNote ? `<p class="text-xs text-slate-400 mt-1">${esc(l.reviewNote)}</p>` : ''}`)}
          ${td(l.status === 'pending' ? `<div class="flex gap-2 justify-end">${UI.button('Approve', `reviewLeave('${l._id}','approved')`, 'ok')}${UI.button('Reject', `reviewLeave('${l._id}','rejected')`, 'no')}</div>` : '')}</tr>`), 'No leave requests')}</div>`;
    }

    // ---------- RESEARCH ----------
    async function renderResearch(el) {
      try { cache.research = await api('/api/research'); } catch (error) { el.innerHTML = UI.empty(error.message); return; }
      const total = cache.research.reduce((s, r) => s + (r.funding || 0), 0);
      el.innerHTML = `<div class="space-y-6 fade">${head('Research Projects', `${cache.research.length} projects • ₹${total.toLocaleString('en-IN')} lakh total funding`, UI.button('+ Add Project', 'researchForm()'))}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">${cache.research.length ? cache.research.map((r) => `<div class="card-hover bg-white rounded-3xl border border-slate-100 p-6 shadow-sm" data-row>
          <div class="flex items-start justify-between"><div><h4 class="text-lg font-extrabold text-slate-800">${esc(r.title)}</h4><p class="text-sm text-slate-500 mt-1">${esc(r.lead || 'No lead')} • ${esc(r.department || 'College')}</p></div>
            <div class="flex gap-1">${UI.iconButton('edit', `researchForm('${r._id}')`, 'Edit')}${UI.iconButton('trash', `deleteResearch('${r._id}')`, 'Delete', 'text-red-400 hover:bg-red-50')}</div></div>
          ${r.description ? `<p class="text-sm text-slate-600 mt-3">${esc(r.description)}</p>` : ''}
          <div class="flex items-center justify-between mt-4">${UI.pill(r.status)}<span class="text-sm font-bold text-slate-700">₹${r.funding || 0} lakh</span></div>
          <div class="mt-3">${UI.progress(r.progress)}</div>
          <p class="text-xs text-slate-400 mt-2">${fmt(r.startDate)} → ${fmt(r.endDate)}</p></div>`).join('') : `<div class="col-span-2">${UI.empty('No research projects yet')}</div>`}</div></div>`;
    }

    function researchForm(id) {
      const r = id ? cache.research.find((x) => x._id === id) : null;
      UI.showForm({
        title: r ? 'Edit Project' : 'Add Research Project', values: r || { status: 'proposed', progress: 0 },
        fields: [
          { name: 'title', label: 'Title', required: true },
          { name: 'lead', label: 'Lead Investigator', half: true },
          { name: 'department', label: 'Department', type: 'select', half: true, options: deptOptions() },
          { name: 'funding', label: 'Funding (₹ lakh)', type: 'number', min: 0, half: true },
          { name: 'status', label: 'Status', type: 'select', half: true, options: ['proposed', 'active', 'completed'].map((v) => ({ value: v, label: v })) },
          { name: 'progress', label: 'Progress %', type: 'number', min: 0, max: 100, half: true },
          { name: 'startDate', label: 'Start', type: 'date', half: true },
          { name: 'endDate', label: 'End', type: 'date', half: true },
          { name: 'description', label: 'Description', type: 'textarea' },
        ],
        onSave: async (v) => { await api(r ? `/api/research/${r._id}` : '/api/research', { method: r ? 'PUT' : 'POST', body: v }); UI.toast('Project saved'); render(); },
      });
    }

    async function deleteResearch(id) {
      if (!confirm('Delete this project?')) return;
      try { await api(`/api/research/${id}`, { method: 'DELETE' }); UI.toast('Project deleted', 'info'); render(); } catch (error) { UI.toast(error.message, 'error'); }
    }

    // ---------- EVENTS & NOTICES ----------
    async function renderEvents(el) {
      try { [cache.events, cache.notices] = await Promise.all([api('/api/events'), api('/api/announcements')]); } catch (error) { el.innerHTML = UI.empty(error.message); return; }
      el.innerHTML = `<div class="space-y-6 fade">${head('Events & Notices', 'College-wide calendar and announcements', `<div class="flex gap-2">${UI.button('+ Event', 'eventForm()')}${UI.button('+ Notice', 'noticeForm()', 'soft')}</div>`)}
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          ${UI.panel('Events', cache.events.length ? `<div class="divide-y divide-slate-50">${cache.events.map((e) => `<div class="px-6 py-4 flex items-center gap-4" data-row>
            <div class="text-center min-w-[44px]"><p class="text-[10px] font-bold text-violet-600 uppercase">${new Date(e.date).toLocaleString('en-US', { month: 'short' })}</p><p class="text-xl font-extrabold text-slate-800 leading-none">${new Date(e.date).getDate()}</p></div>
            <div class="flex-1 min-w-0"><p class="text-sm font-bold text-slate-800">${esc(e.title)}</p><p class="text-xs text-slate-400">${esc([e.type, e.time, e.location, e.department || 'College-wide'].filter(Boolean).join(' • '))}</p></div>
            ${UI.iconButton('trash', `deleteItem('events','${e._id}')`, 'Delete', 'text-red-400 hover:bg-red-50')}</div>`).join('')}</div>` : UI.empty('No events'))}
          ${UI.panel('Notices', cache.notices.length ? `<div class="divide-y divide-slate-50">${cache.notices.map((n) => `<div class="px-6 py-4 flex items-start gap-4" data-row>
            <div class="flex-1"><div class="flex gap-2 items-center mb-1">${UI.pill(n.priority)}<span class="text-xs text-slate-400">${fmt(n.createdAt)} • ${esc(n.createdByName || '')} • ${esc(n.audience)}</span></div>
            <p class="text-sm font-bold text-slate-800">${esc(n.title)}</p>${n.message ? `<p class="text-xs text-slate-500 mt-1">${esc(n.message)}</p>` : ''}</div>
            ${UI.iconButton('trash', `deleteItem('announcements','${n._id}')`, 'Delete', 'text-red-400 hover:bg-red-50')}</div>`).join('')}</div>` : UI.empty('No notices'))}
        </div></div>`;
    }

    function eventForm() {
      UI.showForm({
        title: 'Add College Event',
        fields: [
          { name: 'title', label: 'Event Title', required: true },
          { name: 'date', label: 'Date', type: 'date', required: true, half: true },
          { name: 'endDate', label: 'End Date', type: 'date', half: true },
          { name: 'time', label: 'Time', half: true },
          { name: 'location', label: 'Location', half: true },
          { name: 'type', label: 'Type', type: 'select', default: 'academic', half: true, options: ['academic', 'cultural', 'sports', 'tech', 'meeting', 'exam', 'workshop', 'holiday', 'other'].map((v) => ({ value: v, label: v })) },
          { name: 'audience', label: 'Visible to', type: 'select', default: 'all', half: true, options: [['all', 'Everyone'], ['students', 'Students'], ['faculty', 'Faculty'], ['staff', 'Staff']].map(([value, label]) => ({ value, label })) },
          { name: 'department', label: 'Department (blank = whole college)', type: 'select', options: [{ value: '', label: 'Whole college' }, ...ov.departments.map((d) => ({ value: d.name, label: d.name }))] },
          { name: 'description', label: 'Description', type: 'textarea' },
        ],
        onSave: async (v) => { await api('/api/events', { method: 'POST', body: v }); UI.toast('Event added'); refresh(); },
      });
    }

    function noticeForm() {
      UI.showForm({
        title: 'New Notice', saveLabel: 'Publish',
        fields: [
          { name: 'title', label: 'Title', required: true },
          { name: 'message', label: 'Message', type: 'textarea' },
          { name: 'category', label: 'Category', type: 'select', default: 'general', half: true, options: ['general', 'academic', 'exam', 'fees', 'event', 'research', 'infrastructure'].map((v) => ({ value: v, label: v })) },
          { name: 'priority', label: 'Priority', type: 'select', default: 'medium', half: true, options: ['high', 'medium', 'low'].map((v) => ({ value: v, label: v })) },
          { name: 'audience', label: 'Visible to', type: 'select', default: 'all', options: [['all', 'Everyone'], ['students', 'Students'], ['faculty', 'Faculty'], ['staff', 'Staff']].map(([value, label]) => ({ value, label })) },
        ],
        onSave: async (v) => { await api('/api/announcements', { method: 'POST', body: v }); UI.toast('Notice published'); render(); },
      });
    }

    async function deleteItem(kind, id) {
      if (!confirm('Delete this item?')) return;
      try { await api(`/api/${kind}/${id}`, { method: 'DELETE' }); UI.toast('Deleted', 'info'); refresh(); } catch (error) { UI.toast(error.message, 'error'); }
    }

    // ---------- REPORTS & FINANCE ----------
    function renderReports(el) {
      const f = ov.fees;
      const reportBtn = (type, label, sub) => `<button onclick="LeaderUI.download('${type}', '${label}')" class="flex items-center gap-3 p-4 rounded-2xl border border-slate-100 hover:border-violet-300 hover:bg-violet-50/40 text-left transition" data-row>
          <span class="h-10 w-10 rounded-xl bg-violet-100 text-violet-600 flex items-center justify-center">${UI.icon('download')}</span><span><span class="block text-sm font-bold text-slate-800">${label}</span><span class="text-xs text-slate-400">${sub}</span></span></button>`;
      el.innerHTML = `<div class="space-y-6 fade">${head('Reports & Finance', 'Live fee figures and CSV downloads (open in Excel)')}
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          ${UI.statCard({ label: 'Total Assigned', value: money(f.assigned), iconName: 'money', gradient: 'from-sky-500 to-blue-600' })}
          ${UI.statCard({ label: 'Collected', value: money(f.collected), sub: `${f.percentCollected}%`, iconName: 'check', gradient: 'from-emerald-500 to-teal-600' })}
          ${UI.statCard({ label: 'Outstanding', value: money(f.outstanding), iconName: 'clipboard', gradient: 'from-amber-500 to-orange-600' })}
          ${UI.statCard({ label: 'Students with Dues', value: f.studentsWithDues, sub: `${f.overdueFees} overdue`, iconName: 'users', gradient: 'from-red-500 to-rose-600' })}
        </div>
        ${UI.panel('Monthly Collection (₹ thousands)', UI.bars(f.monthly.map((m) => ({ label: m.label, value: Math.round(m.collected / 1000) })), 'k'))}
        ${UI.panel('Download Reports', `<div class="p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          ${reportBtn('students', 'Students', 'With attendance & marks')}${reportBtn('faculty', 'Faculty', 'All faculty')}${reportBtn('attendance', 'Attendance', 'Per student per subject')}${reportBtn('marks', 'Internal Marks', 'All assessments')}
          ${reportBtn('fees', 'Fees', 'Assigned fees')}${reportBtn('payments', 'Payments', 'Receipts')}${reportBtn('admissions', 'Admissions', 'Applications')}${reportBtn('leaves', 'Leave', 'All requests')}</div>`)}
      </div>`;
    }

    // ---------- START ----------
    document.addEventListener('click', (e) => {
      const panel = document.getElementById('notifPanel');
      if (panel && !panel.classList.contains('hidden') && !e.target.closest('#notifPanel') && !e.target.closest('[onclick*="toggleNotifications"]')) panel.classList.add('hidden');
    });
    if (ERP_SESSION) {
      document.getElementById('app').innerHTML = '<div class="flex-1 flex items-center justify-center text-slate-400">Loading dashboard...</div>';
      refresh();
    }
  </script>
</body>
</html>
